# ---------------------------------------------------------------------------
# wind-hub 配置模板 — 采集任务（周期采集的唯一来源）
# ---------------------------------------------------------------------------
#
# tasks: Mapping，Key 即 Task ID。字段：
#   device_group_id: 引用 devices.yaml 的 device_groups Key（必填）——
#                    仅支持按设备分组下发，不支持直接指定 device。
#   point_group:     str（必填）—— 单值；只采集绑定设备点表中
#                    `point_groups` 含该组的点，该组必须存在于每个匹配
#                    到的启用设备的点表中（加载期校验）。
#   interval:        float > 0（秒），周期采集任务必填。
#   enabled:         bool，默认 true；false 的 Task 不展开任何实例、
#                    不可启动。
#

# 输出目标和 Source→Address 映射在 sinks.yaml 中声明。
# 实例注册为 STOPPED，需经 CLI/Web API 显式 start 才开始采集。

tasks:

  # Modbus 机组遥测（按 device_group 展开）
  turbine-modbus-all:
    device_group_id: turbine_modbus
    point_group: all
    interval: 1.0
    enabled: true

  # ADS 机组遥测（按 device_group 展开）
  turbine-ads-all:
    device_group_id: turbine_ads
    point_group: all
    interval: 1.0
    enabled: true

  # IEC104 机组遥测（按 device_group 展开）
  turbine-iec104-all:
    device_group_id: turbine_iec104
    point_group: all
    interval: 1.0
    enabled: true

  # SCADA 寄存器映射示例：任务禁用，启用前还需启用 modbus_scada Sink
  turbine-modbus-scada:
    device_group_id: turbine_modbus
    point_group: all
    interval: 1.0
    enabled: false

# ---------------------------------------------------------------------------
# wind-hub 路由规则 + 投递策略（Delivery Policy，target 级）
# ---------------------------------------------------------------------------
#
# 匹配模型：每条规则经 `match` 声明匹配条件，只保留两个维度——
#   match.all: true          匹配全部数据（兜底规则）；
#                            与 device_group / point_group 互斥
#   match.device_group       按设备业务类别匹配（devices.yaml 的 device_group，
#                            如 turbine）
#   match.point_group        按点采集分组匹配（points.yaml 中点位的 group，
#                            如 fast / telemetry）
# device_group 与 point_group 同时配置时为 AND；只配置一个时只按该维度匹配；
# 至少必须配置一种匹配条件（空 match 是配置错误，加载期报错）。
#
# 规则按 priority 降序评估，首个命中的规则决定目标 sink 集合
# （first-match-wins）。路由表在配置加载期预编译为
# (device_id, point_id) → sinks 的 O(1) 查询，运行时不逐条扫描规则。
#
# Router 只决定「发到哪些 sink」；每个 target 上的 delivery 决定「这批是否
# 真正投递」——策略属于 (规则, sink) 二元组，同一规则下不同 sink 的节拍
# 相互独立：
#   always    — 缺省；每批都投递（旧行为）
#   interval  — 按 (规则, sink) 限流：距上次投递不足 interval 秒的批次整批抑制
#   every_n   — 按 (规则, sink) 计批：首批投递，之后每 n 批投递一次
#   on_change — 按 (sink, 设备, 点) 记忆上次投递值，值变化（严格不等）才投递
#
# 点位级 sinks 覆盖（points.yaml 中点位的 sinks 字段）优先级最高，命中覆盖的
# 点不经任何规则、始终按 always 投递。

# 未匹配点的策略：
#   drop     — 默认，未匹配点丢弃，启动时不报错（运行时记 WARNING）
#   error    — 启动时校验，发现未覆盖的点直接报 ConfigError
#   default  — 预留：未匹配点发往 default_sink（本版本暂未实现）
unmatched_policy: drop

rules:

  # device_group + point_group 的 AND 匹配：turbine 类设备的 fast 组
  # （ADS 机组 wtg-003/004 的快变遥测）——Kafka 实时流 + DB 限流入库
  - name: turbine-fast
    match:
      device_group: turbine
      point_group: fast
    priority: 100
    targets:
      - sink: kafka_main
        delivery:
          type: always

      - sink: db_main
        delivery:
          type: interval
          interval: 10.0

  # 仅 point_group 单维度匹配：所有设备的 telemetry 组
  # （IEC104 wtg-001 与 Modbus wtg-002 的遥测）值变化才入 Kafka
  - name: telemetry-on-change
    match:
      point_group: telemetry
    priority: 50
    targets:
      - sink: kafka_main
        delivery:
          type: on_change

  # 兜底规则：all: true 匹配其余全部点（含 slow / signals / diag 组）。
  # 注意 p001（beckhoff 基础表，经继承进入 wtg-003/004 的点集）声明了
  # 点位级 sinks 覆盖，不走任何规则；sequential 诊断机位 wtg-005 不参与
  # 周期调度，其点仅在单次读取时经本兜底规则投递。
  - name: default-fanout
    match:
      all: true
    priority: 0
    targets:
      - sink: kafka_main
        delivery:
          type: always     # 缺省即 always，此处显式声明作示例

      - sink: db_main
        delivery:
          type: interval
          interval: 10.0

      - sink: file_archive
        delivery:
          type: every_n
          n: 60

# ---------------------------------------------------------------------------
# wind-hub 现场 Modbus 配置 — 设备实例（2 台风机，Modbus TCP）
# 协议、点表、端口(502)、unit_id、word_order 等由型号
# wtg_modbus_site（common/device_models.yaml）提供；实例只写 host。
# ---------------------------------------------------------------------------

devices:

  - device_id: wtg-002
    model: wtg_modbus_site
    device_group: turbine_modbus
    enabled: true
    endpoint:
      host: "192.168.100.102"

  - device_id: wtg-003
    model: wtg_modbus_site
    device_group: turbine_modbus
    enabled: true
    endpoint:
      host: "192.168.100.103"

# ---------------------------------------------------------------------------
# wind-hub IEC104 从站代理配置 — 向上级调度主站上报点位
#
# 本文件存在即启用从站代理；缺失则禁用（Config.reporting 为 None）。
# reporting 列表把引擎内部的 (device_id, point_id) 映射到 IEC104 信息对象
# 地址（ioa）与遥测方向的 ASDU 类型。
#
# data_type 白名单：
#   M_SP_NA_1 / M_DP_NA_1 / M_ME_NA_1 / M_ME_NB_1 / M_ME_NC_1
#   M_SP_TB_1 / M_DP_TB_1 / M_ME_TF_1
# ---------------------------------------------------------------------------

batch_size: 50       # 总召数据每批最多信息对象数
common_address: 1     # IEC104 公共地址（站地址）
host: "127.0.0.1"     # 从站代理监听地址
port: 12404           # 从站代理监听端口

reporting:

  # ---- wtg-001 (IEC104 风机控制器) ----

  - device_id: wtg-001
    point_id: rotor.speed
    ioa: 1001
    data_type: M_ME_NC_1      # 短浮点测量值

  - device_id: wtg-001
    point_id: gen.power
    ioa: 1002
    data_type: M_ME_NC_1

  - device_id: wtg-001
    point_id: gen.voltage
    ioa: 1003
    data_type: M_ME_NC_1

  - device_id: wtg-001
    point_id: wind.speed
    ioa: 1004
    data_type: M_ME_NC_1

  - device_id: wtg-001
    point_id: status.running
    ioa: 2001
    data_type: M_SP_NA_1      # 单点信息（遥信）

  # ---- wtg-002 (Modbus 风机控制器) ----

  - device_id: wtg-002
    point_id: rotor.speed
    ioa: 3001
    data_type: M_ME_NC_1

  - device_id: wtg-002
    point_id: gen.power
    ioa: 3002
    data_type: M_ME_NC_1
# ---------------------------------------------------------------------------
# wind-hub Modbus 示例配置 — 系统（引擎、接口）
# ---------------------------------------------------------------------------

# 当前现场身份 —— 一个 wind-hub 运行实例只对应一个现场
site:
  site_id: example_modbus
  name: Modbus 示例风场

runtime:
  # 每个 Sink 的内部队列容量（背压阈值）
  queue_maxsize: 1000
  # 背压策略：drop_old（丢最旧）/ drop_new（丢最新）/ block（阻塞）
  backpressure_policy: drop_old
  # 优雅停机超时（秒）
  shutdown_timeout: 30.0
  # 设备连接超时（秒）
  connect_timeout: 10.0
  # 单次读取超时（秒）——一次批量读的应用层外层兜底
  read_timeout: 5.0
  # 一次逻辑读/写操作允许的最大连接恢复次数（读前恢复与读后失败再恢复
  # 共享同一预算），0 为禁止自动重连，默认 1
  # reconnect_attempts: 1
  # 单次写入默认超时（秒）——Command.timeout <= 0 时生效
  write_timeout: 5.0


interfaces:
  api:
    enabled: true
    host: "127.0.0.1"
    port: 8080

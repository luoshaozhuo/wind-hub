# Sink 输出配置：仅支持 CSV File、Modbus TCP Server、Redis
sinks:
  - name: file_archive
    type: file
    enabled: true
    connection:
      path: /var/tmp/wind-hub/archive.csv
      max_size_mb: 100
    points: []

  - name: modbus_scada
    type: modbus
    enabled: false
    connection:
      host: "0.0.0.0"
      port: 1502
    # points 使用 source + address 映射 Modbus 寄存器
    points: []

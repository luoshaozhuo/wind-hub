# ---------------------------------------------------------------------------
# wind-hub 配置模板 — 设备实例与设备分组
# ---------------------------------------------------------------------------
#
# device_groups: Mapping，Key 即 DeviceGroup ID。所有分组必须在此显式声明；
# 设备引用未定义的分组是配置错误（不隐式创建）。字段：
#   name:        str，可选 —— 展示名，缺省等于 ID。
#   description: str，可选。
#
# devices: Mapping，Key 即 Device ID。实例只描述「身份、型号引用、连接
# 差异」；协议、点表与连接默认值来自 device_models.yaml 的型号定义。字段：
#   model_id:         引用 device_models.yaml 的 device_models Key（必填）。
#   device_group_ids: list[str]，必填且至少一个 —— 引用 device_groups 的
#                     Key；采集分组，Task 按它成组下发（见 tasks.yaml）。
#   enabled:          bool，默认 true；false 的设备不参与采集/命令。
#   name:             str，可选 —— 实例展示名。
#   endpoint:         必填 —— 只允许两个字段：
#       host: str，必填 —— 设备 IP / 主机名。
#       port: int 1..65535，可选 —— 缺省用型号 endpoint_defaults.port，
#             再缺省用协议代码默认（Modbus 502、IEC104 2404、
#             ADS TwinCAT 2/3 第一 PLC Runtime 801/851）。
#   protocol_options: Mapping，可选 —— 设备级协议参数，覆盖型号
#                     protocol_options 同名键（浅层同名 Key 覆盖，不用
#                     null 隐式删除）；只允许当前设备协议的合法参数，
#                     未知参数是配置错误。
#
# 参数优先级：设备显式 > 型号默认 > 协议代码默认。
#
# ----------------------------- 协议参数清单 -----------------------------
#
# Modbus（protocol_options）：
#   mode:            仅支持 tcp（默认）。
#   slave_id:        int 0..255，默认 1 —— Modbus 从站地址（Unit
#                    Identifier）。
#   timeout:         float > 0（秒），默认 5.0 —— 协议栈单次请求超时；
#                    与 runtime.connect_timeout/read_timeout（应用层调度
#                    超时）语义不同，各自独立生效。
#   word_order:      big_endian / little_endian，默认 little_endian ——
#                    多寄存器值的字序（点 address 可逐点覆盖）。
#   health_point_id: str，可选 —— 健康检查读取的 Point ID，必须存在于该
#                    设备绑定点表（继承展开后）；未配置时 Driver 用点表第
#                    一个点做健康读。由 Modbus Driver 消费（health()），
#                    Watchdog 只调用 Driver.health，不直接读该参数。
#
# ADS（protocol_options）：
#   target_net_id:   目标 AMS Net ID（6 段点分），通常为 PLC IP + ".1.1"。
#                    ADS 设备必须显式指定；同一 Collector 中所有启用 ADS
#                    设备的目标 Net ID 不得重复，冷启动/热重载在连接前拒绝冲突。
#                    不同 Collector 进程允许连接相同目标，源 AMS 身份须各自配置。
#                    属于设备实例差异，不在型号中固定。
#   twincat_version: "2" / "3"，默认 "2" —— 决定 AMS Runtime Port 默认值：
#                    TwinCAT 2 第一 PLC Runtime 801，TwinCAT 3 第一 PLC
#                    Runtime 851；endpoint.port 显式配置时覆盖。
#   timeout:         float > 0（秒），默认 5.0 —— ADS 请求超时。
#   max_subs_per_sum:                int > 0，默认 500 —— 单次 Sum Read
#                                    最大订阅数。
#   max_block_bytes:                 int > 0，默认 1024 —— 单次 ADS 区块通知最大字节数。
#   max_delay:                       float >= 0（秒），默认 0.06 —— 通知
#                                    最大延迟。
#   max_notifications_per_connection: int > 0，默认 550 —— 单连接最大通知数。
#   route_auto_add:                  bool，默认 false —— 自动添加 AMS 路由。
#   username:        str，默认 Administrator —— 远程 PLC 路由注册用户名
#                    （wind-hub 应用层默认值，非 pyads 默认值）。
#   password:        str，默认 "" —— 远程 PLC 路由注册密码；空密码表示
#                    未提供有效密码，不保证远程 PLC 接受；route_auto_add
#                    为 false 时不使用凭据。不要在模板中填写真实生产密码。
#   subscribe_enabled:               bool，默认 false —— Collector 进程级
#                    采集策略：true 使用 ADS 订阅推送（notification），
#                    false 使用周期 Sum Read。仅 ADS 设备允许；不进 Driver
#                    协议参数。
#
# IEC104（protocol_options）：
#   common_addresses: int 或逗号分隔整数串，默认 1 —— 一条 TCP 连接承载
#                    的全部 ASDU 公共地址（多 CA）；首项为点缺省 CA。
#   health_point:   str，可选 —— 应用层健康探测点；缺省只判断链路健康。
#   k:           int >= 1，默认 12 —— 发送窗口（未确认 I 帧上限）。
#   w:           int >= 1 且 <= k，默认 8 —— 接收确认窗口。
#   t0:          float > 0（秒），默认 30 —— 连接建立超时。
#   t1:          float > 0（秒），默认 15 —— 发送/测试帧确认超时。
#   t2:          float > 0 且 <= t1（秒），默认 10 —— 无数据时确认等待。
#   t3:          float > 0（秒），默认 20 —— 空闲时测试帧周期。
#   IEC104 持续采集恒为本地监听（LISTEN）+ Collector 显式总召模式，
#   无 subscribe_enabled；IEC104 没有远程订阅原语。
#
# --------------------------- 本机模拟拓扑说明 ---------------------------
#
# 本模板中的 30 台设备全部是【本机模拟设备】，不是真实 PLC：
#
#   Modbus:  modbus-001..010 → 127.0.0.11..20，TCP 1502（型号默认）
#   ADS:     ads-001..010    → 127.0.0.21..30，AMS Runtime Port 851（型号默认）
#   IEC104:  iec104-001..010 → 127.0.0.31..40，TCP 12404（型号默认）
#
# - 每台设备使用独立的 127.0.0.0/8 回环 IP，使设备身份与真实部署一致；
#   同型号设备共享型号默认端口。
# - ADS 的 endpoint.port 是 AMS Runtime Port，不是 ADS 模拟服务器的 TCP
#   监听端口；ADS 通信还要求正确的 AMS 路由与可用的 ADS 模拟服务器
#   （见 system.yaml 的 ads 段）。Linux 下多回环 IP 通常无需额外配置，
#   WSL/容器网络或模拟服务器绑定方式不同时，应单独调整模拟部署，
#   不改变正式 Schema。
# - 配置加载成功不代表模拟设备正在运行；模拟设备启动后才能完成真实
#   协议通信。模拟服务未启动导致的连接失败不是配置错误。

device_groups:

  turbine_modbus:
    name: Modbus 机组

  turbine_ads:
    name: ADS 机组

  turbine_iec104:
    name: IEC104 机组


devices:

  # ---- Modbus 本机模拟设备 ×10（端口/slave_id 等来自型号默认值） ----
  modbus-001:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.11"

  modbus-002:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.12"

  modbus-003:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.13"

  modbus-004:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.14"

  modbus-005:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.15"

  modbus-006:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.16"

  modbus-007:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.17"

  modbus-008:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.18"

  modbus-009:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.19"

  # 覆盖示例：仅覆盖 slave_id，其余参数继续继承型号默认值
  modbus-010:
    model_id: modbus_wtg
    device_group_ids: [turbine_modbus]
    endpoint:
      host: "127.0.0.20"
    protocol_options:
      slave_id: 10

  # ---- ADS 本机模拟设备 ×10（TwinCAT 3；端口/twincat_version 来自型号默认值） ----
  # 每台设备必须有不同的目标 AMS Net ID（通常为设备 IP + ".1.1"），
  # 不允许所有设备共用同一个 target_net_id。
  ads-001:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.21"
    protocol_options:
      target_net_id: "127.0.0.21.1.1"

  ads-002:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.22"
    protocol_options:
      target_net_id: "127.0.0.22.1.1"

  ads-003:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.23"
    protocol_options:
      target_net_id: "127.0.0.23.1.1"

  ads-004:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.24"
    protocol_options:
      target_net_id: "127.0.0.24.1.1"

  ads-005:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.25"
    protocol_options:
      target_net_id: "127.0.0.25.1.1"

  ads-006:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.26"
    protocol_options:
      target_net_id: "127.0.0.26.1.1"

  ads-007:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.27"
    protocol_options:
      target_net_id: "127.0.0.27.1.1"

  ads-008:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.28"
    protocol_options:
      target_net_id: "127.0.0.28.1.1"

  ads-009:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.29"
    protocol_options:
      target_net_id: "127.0.0.29.1.1"

  # 覆盖示例：覆盖远程路由注册用户名（不要在模板中填写真实生产密码），
  # 其余参数继续继承型号默认值
  ads-010:
    model_id: beckhoff_wtg
    device_group_ids: [turbine_ads]
    endpoint:
      host: "127.0.0.30"
    protocol_options:
      target_net_id: "127.0.0.30.1.1"
      username: RouteAdmin

  # ---- IEC104 本机模拟设备 ×10（端口/common_addresses 等来自型号默认值） ----

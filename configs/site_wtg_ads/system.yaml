# ---------------------------------------------------------------------------
# wind-hub 现场 ADS 配置 — 系统（引擎、ADS 本机、Sink、接口）
# ---------------------------------------------------------------------------

# 当前现场身份 —— 一个 wind-hub 运行实例只对应一个现场
site:
  site_id: wtg_ads
  name: ADS 现场风场

runtime:
  queue_maxsize: 1000
  backpressure_policy: drop_old
  shutdown_timeout: 30.0
  connect_timeout: 10.0
  read_timeout: 5.0
  write_timeout: 5.0

# 进程级 ADS 本机配置
ads:
  local_ams_net_id: "192.168.151.244.1.2"
  local_ip: "192.168.151.244"
  route_repair:
    enabled: true
    route_name: "PFR"
    username: "Administrator"
    password: ""

sinks:
  - name: kafka_main
    type: kafka
    enabled: false
    params:
      bootstrap_servers: "localhost:9092"
      topic: wind-hub.raw

  - name: db_main
    type: db
    enabled: false
    params:
      dsn: "postgresql://windhub:windhub@localhost:5432/windhub"
      table: points
      batch_size: 1000

  - name: file_archive
    type: file
    enabled: true
    params:
      path: /var/tmp/wind-hub/archive.jsonl
      format: jsonl
      compress: false

interfaces:
  api:
    enabled: true
    host: "127.0.0.1"
    port: 8080
  cli:
    enabled: true

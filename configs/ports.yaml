# 端口扫描配置
#
# ``wind-hub probe ports`` 未指定 --ports 时扫描 mapping 的全部端口；
# mapping 同时用于报告里的服务名标注（纯端口映射，不做 banner grabbing）。

# 端口到服务名的映射（未指定 --ports 时扫描这些端口）
mapping:
  # 工业协议
  502: modbus
  2404: iec104
  48898: ads
  4840: opc-ua
  44818: ethernet-ip
  20000: dnp3
  102: s7comm
  9600: omron-fins

  # 通用服务
  21: ftp
  22: ssh
  23: telnet
  25: smtp
  53: dns
  80: http
  443: https
  445: smb
  3306: mysql
  5432: postgresql
  6379: redis
  8080: http
  8443: https

# 端口扫描的默认超时（秒）
timeout: 1.0

# 端口扫描的默认并发
concurrency: 128

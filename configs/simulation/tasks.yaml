# configs/simulation/tasks.yaml — 由 scripts/simulator/gen_config.py 生成
# 与 scripts/simulator（40 台模拟 PLC）一一对应；拓扑变化时重跑生成脚本，
# 不要手工偏离模拟器布局。
tasks:
- task_id: sim-modbus-all
  device_group: turbine_modbus
  point_group: all
  interval: 1.0
  targets:
  - sink: file_archive
  enabled: true
- task_id: sim-iec104-all
  device_group: turbine_iec104
  point_group: all
  interval: 1.0
  targets:
  - sink: file_archive
  enabled: true
- task_id: sim-ads-all
  device_group: turbine_ads
  point_group: all
  interval: 1.0
  targets:
  - sink: file_archive
  enabled: true

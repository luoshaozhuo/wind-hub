# ---------------------------------------------------------------------------
# wind-hub 点表 — 命名点表集合（设备无关、可被同类型设备复用、可单继承）
# ---------------------------------------------------------------------------

# 点表模型
#
# - 点表是【设备无关】的完整点集定义；设备通过 devices.yaml 的
#   `point_table: <表名>` 绑定获得点集，多台同类型设备共享同一份定义，
#   不逐设备复制。
# - 三个标识各司其职、不得混用：
#     point_id        — 系统内部稳定 ID（如 p001），与具体设备无关，
#                       也是继承合并的唯一主键
#     variable_name   — 业务变量名（如 rotor_speed），仅供展示与诊断
#     address.symbol  — PLC Symbol（协议寻址字段，见下）
# - `point_groups` 把点归入一个或多个采集分组（多值）；Task 按
#   point_group 选择点（task.point_group ∈ point.point_groups），
#   不存在逐点 Task。点不再声明输出 sink——输出去向由 Task 的
#   targets 决定（见 tasks.yaml）。
#
# 点表继承（extends）
#
# - 每张表最多继承一个父表（单继承），允许多级链：
#     beckhoff_base_v1 → beckhoff_2mw_v1 → beckhoff_2mw_site_a
# - 合并主键只有 point_id：子表写了父表已有的 point_id → override；
#   写了父表没有的 point_id → 新增。
# - remove_points 按 point_id 从父表结果中删除；删除不存在的点是配置错误。
# - 覆盖语义：
#     * 普通字段——子表写了就覆盖（显式写 null 也会覆盖为 null），
#       没写就继承父表值；
#     * address —— 显式配置即整体替换，不残留父表的 symbol/index 字段；
# - 解析顺序：父表解析结果 → remove_points → 子表 points override/新增，
#   全部展开为完整点后统一校验（data_type、ADS 地址约束等）。
#   设备绑定校验（ADS sum 全 symbol）与 Task 的 point_group 存在性校验
#   都作用于继承展开后的最终点集。
#
# scale / offset：工程值换算参数（value = raw * scale + offset），
# 由运行时 Device 在采集出口统一应用（轮询与订阅同语义）。
#
# 各协议的 address 字段
# - IEC104: `type` + `ioa`，如 type: measured_value / ioa: 1001
# - Modbus: `type` + `address`，如 type: holding_register / address: 30001
#   （register_type 是 type 的兼容别名，推荐用 type；Modbus 点必须用
#    address 字段，不是 register）
# - ADS（Symbol 优先）：
#     symbol: MAIN.rotorSpeed               # 推荐：仅 Symbol 寻址
#     index_group: 0x4020                   # 兼容寻址：必须与 index_offset 成对
#     index_offset: 0x1234                  #   出现（只写一个是配置错误）
#   symbol 与 index 同时配置是允许的——实际读写永远以 symbol 优先；
#   三者全空是配置错误。以上均在配置加载阶段校验，不等运行时失败。
#   注意：read_mode: sum 的设备，其绑定点表（继承展开后）必须全部点位
#   配置 symbol（Sum 命令按 Symbol 批量读）；仅 index 寻址的点只能放在
#   sequential 设备绑定的表里（见 beckhoff_diag_v1 的 p401）。

point_tables:

  # Beckhoff 风机控制器基础点表 —— 同系列机型共用点集。
  # 不直接被设备绑定，作为机型表/现场表的继承基座。
  beckhoff_base_v1:
    points:

      - point_id: p001
        variable_name: rotor_speed
        point_groups: [fast]               # 快变遥测；由 tasks.yaml 的 fast 组 Task 周期采集
        address:
          symbol: MAIN.rotorSpeed # PLC Symbol 寻址（推荐形式）
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"

      - point_id: p002
        variable_name: gen_power
        point_groups: [fast]
        address:
          symbol: MAIN.genPower
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"

      - point_id: p003
        variable_name: gen_voltage
        point_groups: [slow]               # 慢变量，按 slow 组周期采集
        address:
          symbol: MAIN.genVoltage
          index_group: 0x4020     # symbol 与 index 同时配置：允许，
          index_offset: 0x1234    # 实际读写以 symbol 优先
        data_type: float32
        scale: 0.001
        offset: 0.0
        unit: kV
        description: "发电机电压"

      - point_id: p004
        variable_name: status_running
        point_groups: [fast]
        address:
          symbol: MAIN.statusRunning
        data_type: bool
        description: "运行状态"

  # 2MW 机型点表 —— 继承基础表：删除本机型没有的电压点，覆盖功率点的
  # Symbol 与量程上限，新增变流器温度点。p001 / p004 原样继承不修改。
  beckhoff_2mw_v1:
    extends: beckhoff_base_v1

    remove_points:
      - p003                      # 2MW 机型无此电压测点

    points:

      - point_id: p002            # override：address 整体替换；其余字段继承父表
        address:
          symbol: MAIN.power.genActivePower

      - point_id: p005            # 新增点：父表没有的 point_id
        variable_name: converter_temp
        point_groups: [slow]
        address:
          symbol: MAIN.converterTemp
        data_type: float32
        unit: degC
        description: "变流器温度"

  # 现场 A 变体点表 —— 继承 2MW 机型表，按现场 PLC 调整分组与 Symbol。
  beckhoff_2mw_site_a:
    extends: beckhoff_2mw_v1

    points:

      - point_id: p002            # group override：fast → slow（现场功率低频采集）
        point_groups: [slow]

      - point_id: p005            # address override：现场 PLC 的 Symbol 命名空间
        address:
          symbol: PLC1.Measurements.converterTemp

  # Beckhoff ADS 诊断点表 —— 独立表（不继承），绑定到 read_mode: sequential
  # 的诊断机位（wtg-005）：逐点读，Symbol 优先、无 symbol 回退 index 对；
  # 不参与周期采集（diag 组不出现在任何 Task 中），分组仅作分类用途。
  beckhoff_diag_v1:
    points:

      - point_id: p401
        variable_name: legacy_counter
        point_groups: [diag]
        address:                  # 兼容寻址：仅 index_group + index_offset（成对）
          index_group: 0x4020
          index_offset: 0x2000
        data_type: uint32
        scale: 1.0
        offset: 0.0
        description: "legacy 计数器（无 Symbol 的老变量，sequential 逐点按 index 读）"

      - point_id: p402
        variable_name: diag_state
        point_groups: [diag]
        address:
          symbol: MAIN.diagState  # sequential 下按 Symbol 逐点读
          index_group: 0x4020     # symbol 与 index 同时配置：允许，
          index_offset: 0x3000    # 实际读写以 symbol 优先
        data_type: int32
        description: "诊断状态字"

  # IEC104 风机点表
  iec104_wtg_v1:
    points:

      - point_id: p101
        variable_name: rotor_speed
        point_groups: [telemetry]
        address:
          type: measured_value
          ioa: 1001
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"

      - point_id: p102
        variable_name: gen_power
        point_groups: [telemetry]
        address:
          type: measured_value
          ioa: 1002
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"

      - point_id: p103
        variable_name: wind_speed
        point_groups: [telemetry]
        address:
          type: measured_value
          ioa: 1004
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: m/s
        description: "风速"

      - point_id: p104
        variable_name: status_running
        point_groups: [signals]
        address:
          type: single_point
          ioa: 2001
        data_type: bool
        description: "运行状态（遥信）"

  # Modbus 风机点表
  modbus_wtg_v1:
    points:

      - point_id: p201
        variable_name: rotor_speed
        point_groups: [telemetry]
        address:
          type: holding_register
          address: 30001
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"

      - point_id: p202
        variable_name: gen_power
        point_groups: [telemetry]
        address:
          type: holding_register
          address: 30003
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"

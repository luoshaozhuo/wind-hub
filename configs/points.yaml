# ---------------------------------------------------------------------------
# wind-hub 点表 — 命名点表集合（设备无关、可被同类型设备复用）
# ---------------------------------------------------------------------------

# 点表模型
#
# - 点表是【设备无关】的完整点集定义；设备通过 devices.yaml 的
#   `point_table: <表名>` 绑定获得点集，多台同类型设备共享同一份定义，
#   不逐设备复制。
# - 三个标识各司其职、不得混用：
#     point_id        — 系统内部稳定 ID（如 p001），与具体设备无关
#     name            — 业务变量名（如 rotor_speed），仅供展示与诊断
#     address.symbol  — PLC Symbol（协议寻址字段，见下）
# - `group` 把点归入采集分组；设备的 polling 配置按组定义周期，
#   一个 (device, group) 对应一个调度 Job（不存在逐点 Job）。
#
# Processor 参数的单位语义（推荐处理链顺序：quality_check → unit_convert → deadband）
# - min_value / max_value：作用于【原始读数】（换算前）
# - deadband：作用于【换算后读数】（换算后）
# - scale / offset：unit_convert 的换算参数
#
# 各协议的 address 字段
# - IEC104: `type` + `ioa`，如 type: measured_value / ioa: 1001
# - Modbus: `type` + `address`，如 type: holding_register / address: 30001
#   （register_type 是 type 的兼容别名，推荐用 type；Modbus 点必须用
#    address 字段，不是 register）
# - ADS（Symbol 优先）：
#     symbol: MAIN.rotorSpeed               # 推荐：仅 Symbol 寻址
#     index_group: 0x4020                   # 兼容寻址：必须与 index_offset 成对
#     index_offset: 0x1234                  #   出现（只写一个是配置错误）
#   symbol 与 index 同时配置是允许的——实际读写永远以 symbol 优先；
#   三者全空是配置错误。以上均在配置加载阶段校验，不等运行时失败。

point_tables:

  # Beckhoff ADS 风机的共用点表 —— wtg-003 / wtg-004 / wtg-005 三台同类型
  # ADS 设备共享这一份定义。
  beckhoff_wtg_v1:
    points:

      - point_id: p001
        name: rotor_speed
        group: fast               # 快变遥测，设备 polling 中按 fast 组周期采集
        address:
          symbol: MAIN.rotorSpeed # PLC Symbol 寻址（推荐形式）
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"
        deadband: 0.5             # 死区 0.5 rpm：变化量小于该值不输出
        min_value: 0
        max_value: 2000
        # 点位级 sinks 覆盖默认路由规则
        sinks:
          - kafka_main
          - file_archive

      - point_id: p002
        name: gen_power
        group: fast
        address:
          symbol: MAIN.genPower
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"
        deadband: 1.0
        min_value: 0
        max_value: 10000

      - point_id: p003
        name: gen_voltage
        group: slow               # 慢变量，按 slow 组周期采集
        address:
          symbol: MAIN.genVoltage
          index_group: 0x4020     # symbol 与 index 同时配置：允许，
          index_offset: 0x1234    # 实际读写以 symbol 优先
        data_type: float32
        scale: 0.001
        offset: 0.0
        unit: kV
        description: "发电机电压"

      - point_id: p004
        name: legacy_counter
        group: slow
        address:                  # 兼容寻址：仅 index_group + index_offset（成对）
          index_group: 0x4020
          index_offset: 0x2000
        data_type: uint32
        scale: 1.0
        offset: 0.0
        description: " legacy 计数器（无 Symbol 的老变量）"

      - point_id: p005
        name: status_running
        group: fast
        address:
          symbol: MAIN.statusRunning
        data_type: bool
        description: "运行状态"

  # IEC104 风机点表
  iec104_wtg_v1:
    points:

      - point_id: p101
        name: rotor_speed
        group: telemetry
        address:
          type: measured_value
          ioa: 1001
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"
        deadband: 0.5
        min_value: 0
        max_value: 2000

      - point_id: p102
        name: gen_power
        group: telemetry
        address:
          type: measured_value
          ioa: 1002
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"
        deadband: 1.0
        min_value: 0
        max_value: 10000

      - point_id: p103
        name: wind_speed
        group: telemetry
        address:
          type: measured_value
          ioa: 1004
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: m/s
        description: "风速"
        min_value: 0
        max_value: 50
        sinks:
          - file_archive          # 仅归档，不发 Kafka

      - point_id: p104
        name: status_running
        group: signals
        address:
          type: single_point
          ioa: 2001
        data_type: bool
        description: "运行状态（遥信）"
        sinks:
          - kafka_main

  # Modbus 风机点表
  modbus_wtg_v1:
    points:

      - point_id: p201
        name: rotor_speed
        group: telemetry
        address:
          type: holding_register
          address: 30001
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: "风轮转速"

      - point_id: p202
        name: gen_power
        group: telemetry
        address:
          type: holding_register
          address: 30003
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kW
        description: "发电机有功功率"
        sinks:
          - kafka_main

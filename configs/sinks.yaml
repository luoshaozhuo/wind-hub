# ---------------------------------------------------------------------------
# wind-hub 配置模板 — Sink 输出（支持 TDengine 历史存储、Modbus TCP Server、Redis）
# ---------------------------------------------------------------------------
#
# sinks: Mapping，Key 即 Sink ID（Task 经 outputs[].sink_id 引用）。字段：
#   type:       modbus / redis / tdengine（必填）。
#   enabled:    bool，默认 true；enabled Task 不允许引用 disabled Sink；
#               同一 host:port 不允许两个 enabled 的 Modbus Sink。
#   connection: Mapping（必填）—— 按 type 不同（见下）。
#
# connection 字段：
# - tdengine: host, port(6041), database, stable, username, password, timeout, tls\n#             使用 taosAdapter REST；数据库需提前创建。\n# - redis:\n#     host:       str，默认 localhost。
#     port:       int 1..65535，默认 6379。
#     database:   int >= 0，默认 0。
#     username:   str，可选，ACL 用户名；配置后必须同时设置 password。
#     password:   str，可选。
#     timeout:    float > 0，默认 1 秒，连接及命令超时。
#     key_prefix: str，默认 "wind-hub"。
# - modbus（Modbus TCP Server，对 SCADA 暴露寄存器）:
#     host: str，默认 0.0.0.0 —— 监听地址。
#     port: int 1..65535，默认 502。
#
# Task outputs[].points 条目字段（仅在 tasks.yaml 声明）：
#   source:    必填 —— 内部点引用：{device_id, point_id}，必须存在于
#              该设备绑定点表（继承展开后）。
#   ref:       str，可选 —— 对外引用名，缺省 "<device_id>.<point_id>"；
#              Sink 内不允许重复。
#   datatype:  可选 —— 对外数据类型，缺省与源点一致；数值类型间才可转换。
#   unit:      可选 —— 对外单位标识，缺省与源点一致。
#   scale / offset: float，默认 1.0 / 0.0 —— 仅数值类型允许换算。
#   address:   必填 —— 按 Sink 类型：
#       redis: {field: <对外字段名>}，Sink 内不允许重复。
#       modbus: {slave_id: 0..255,
#                register_type: holding / input / coil / discrete,
#                address: 0..65535,          # 0-based 起始地址
#                byte_order: big / little,   # 默认 big
#                word_order: big / little}   # 默认 big
#              coil/discrete 只接受 bool；寄存器区间按数据类型宽度计算，
#              不允许重叠或越界（> 65535）。

sinks:

  # Redis 最新值输出
  redis_latest:
    type: redis
    enabled: true
    connection:
      host: "127.0.0.1"
      port: 6379
      database: 0
      timeout: 1.0
      key_prefix: "wind-hub"

  # 历史时序库：密码应由部署时安全注入，勿在生产仓库保存明文。
  tdengine_history:
    type: tdengine
    enabled: false
    connection:
      host: "127.0.0.1"
      port: 6041
      database: wind_hub
      stable: point_values
      username: root
      password: "CHANGE_ME"
      timeout: 5
      tls: false

  # Modbus TCP Server（对 SCADA 暴露寄存器；默认关闭）
  modbus_scada:
    type: modbus
    enabled: false
    connection:
      host: "0.0.0.0"
      port: 1502

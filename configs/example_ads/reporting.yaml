# ---------------------------------------------------------------------------
# wind-hub IEC104 从站代理配置 — 向上级调度主站上报点位
#
# `reporting` 为空列表（或本文件缺失）即禁用从站代理——本示例不启用。
# 启用时把引擎内部的 (device_id, point_id) 映射到 IEC104 信息对象地址
# （ioa）与遥测方向 ASDU 类型，例如：
#
# reporting:
#   - device_id: wtg-001
#     point_id: grid_active_power
#     ioa: 1001
#     data_type: M_ME_NC_1      # 短浮点测量值
# ---------------------------------------------------------------------------

reporting: []
batch_size: 50        # 总召数据每批最多信息对象数
common_address: 1     # IEC104 公共地址（站地址）
host: "127.0.0.1"     # 从站代理监听地址
port: 12404           # 从站代理监听端口

# Sink 输出配置：仅支持 CSV File、Modbus TCP Server、Redis
sinks:
  - name: file_archive
    type: file
    enabled: true
    connection:
      path: /var/tmp/wind-hub/archive.csv
      max_size_mb: 100
      max_files: 30
    points: []

  - name: redis_cache
    type: redis
    enabled: false
    connection:
      host: localhost
      port: 6379
      database: 0
      key_prefix: wind-hub
    points: []

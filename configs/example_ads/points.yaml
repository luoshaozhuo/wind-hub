point_tables:
  wtg_ads_site_v1:
    protocol: ads
    points:
      wind_speed:
        business_point_id: wind_speed
        variable_name: wind_speed
        point_groups:
        - all
        address:
          symbol: .wind_speed
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: meter_per_second
        description: 风速
      wind_vane_wind_direction:
        business_point_id: wind_vane_wind_direction
        variable_name: wind_vane_wind_direction
        point_groups:
        - all
        address:
          symbol: .wind_vane_wind_direction
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: degree
        description: 风向
      grid_active_power:
        business_point_id: grid_active_power
        variable_name: grid_active_power
        point_groups:
        - all
        address:
          symbol: .grid_active_power
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kilowatt
        description: 并网有功功率
      grid_reactive_power:
        business_point_id: grid_reactive_power
        variable_name: grid_reactive_power
        point_groups:
        - all
        address:
          symbol: .grid_reactive_power
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: kilovar
        description: 并网无功功率
      generator_speed:
        business_point_id: generator_speed
        variable_name: overspeed_modul_generator_speed_signal_1
        point_groups:
        - all
        address:
          symbol: .overspeed_modul_generator_speed_signal_1
        data_type: float32
        scale: 1.0
        offset: 0.0
        unit: rpm
        description: 发电机转速信号

# ---------------------------------------------------------------------------
# wind-hub ADS 示例配置 — 系统（引擎、ADS 本机、接口）
# ---------------------------------------------------------------------------

# 当前现场身份 —— 一个 wind-hub 运行实例只对应一个现场
site:
  site_id: example_ads
  name: ADS 示例风场

runtime:
  queue_maxsize: 1000
  backpressure_policy: drop_old
  shutdown_timeout: 30.0
  connect_timeout: 10.0  # 未配置时默认 1
  read_timeout: 5.0  # 未配置时默认 1
  # 一次逻辑读取在首次尝试失败后允许的额外重试次数（连接失败与可恢复
  # 的通信失败共享同一预算）：0 不重试，-1 无限重试，默认 1
  # read_retries: 1
  # 每次读取重试前的等待间隔（秒），允许 0，默认 1
  # retry_interval: 1.0
  write_timeout: 5.0  # 未配置时默认 1

# 进程级 ADS 本机配置（Linux / WSL mirrored / 容器下本机作为 AMS 路由器）
# —— 不属于任何单台 Device；进程启动时 open_port + set_local_address 一次。
ads:
  # 本机（wind-hub 所在主机/容器）AMS Net ID 与 IP
  local_ams_net_id: "192.168.151.244.1.2"
  local_ip: "192.168.151.244"
  username: "Administrator"
  password: ""


interfaces:
  api:
    enabled: true
    host: "127.0.0.1"
    port: 8080

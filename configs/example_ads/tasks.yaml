# ---------------------------------------------------------------------------
# wind-hub ADS 示例配置 — 采集任务
# ---------------------------------------------------------------------------
#
# 按 device_group 展开为每台机组一个 Task Instance。
# Runtime 启动后任务保持 STOPPED，需通过 CLI / Web API 显式启动。

tasks:

  - task_id: turbine-ads-all
    device_group: turbine_ads
    point_group: all
    interval: 1.0
    targets:
      - sink: file_archive
    enabled: true

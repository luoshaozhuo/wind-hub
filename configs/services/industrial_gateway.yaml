# Industrial Gateway Service v1.1.0 — per-Server control routing.
# config_sources.instances.devices: explicitly choose devices.yaml for real devices
#   or devices_sim.yaml for simulation; never merge these inventories implicitly.
# grpc: Gateway management listener, separate from industrial protocol Server ports.
# servers[]: one device per protocol listener; IDs and ports must be unique.
# servers[].control.enabled: false by default in this safe example.
# servers[].control.target.kind: none | commander.
#   none has no outbound command execution; disable control and leave mappings empty.
#   commander: specify endpoint, optional loopback plaintext TLS configuration,
#     request_timeout_ms (1..60000), queue_capacity (1..65536), max_inflight (1..256).
# servers[].control.simulation: optional dedicated Generator INPUT binding; usable
#   only through Commander-authorized ExecuteSimulationCommand with mTLS.
#   Direct protocol-write forwarding to Generator is prohibited.
# servers[].control.mappings: variable_id is a writable industrial protocol point;
#   target_point_id must be authorized by Commander; IDs unique.
#   Normal Gateway gRPC variable injection never invokes protocol-write callbacks.
# A successful industrial protocol ACK does not mean outbound command accepted.
# Forwarding is best-effort, bounded and non-persistent; no retry on unknown result.
# All target credentials and trust roots must be provisioned by deployment.
schema_version: 1
file_version: "1.1.0"

config_sources:
  instances:
    devices: configs/instances/devices.yaml
  templates:
    root: configs/templates

grpc:
  listen_host: "127.0.0.1"
  listen_port: 50073
  max_active_rpcs: 64
  request_max_bytes: 2097152
  tls:
    enabled: false

servers:
  - server_id: gateway-tz01
    device_id: TZ01
    listen_host: "127.0.0.1"
    listen_port: 15020
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []

metrics:
  window_seconds: 60
  collect_interval_ms: 1000

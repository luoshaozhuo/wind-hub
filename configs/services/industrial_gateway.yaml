# Industrial Gateway v1 service-only configuration.
# All devices, protocol parameters and point tables are read from shared documents.
schema_version: 1
file_version: "1.1.0"

config_sources:
  instances:
    devices: configs/instances/devices.yaml
  templates:
    root: configs/templates

grpc:
  listen_host: "127.0.0.1"
  listen_port: 50073
  max_active_rpcs: 64
  request_max_bytes: 2097152
  tls:
    enabled: false

servers:
  - server_id: gateway-tz01
    device_id: TZ01
    listen_host: "127.0.0.1"
    listen_port: 15020
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []

metrics:
  window_seconds: 60
  collect_interval_ms: 1000

# 隔离 Sink Gateway 输出目标；Loopback Sink 授权入口与令牌管理入口隔离。
# WTG_SINK01 不属于 Collector e2e-source 采集 group。
# Service 仅引用 Instance 逻辑身份；Deployment 统一选定不可变文件版本。
# Instance 固定引用 Template，Service 不声明 templates.root。
# Industrial Gateway simulation target, aligned with device_sim_v1.2.0.yaml and
# Data Generator scenario wind-plant-physical.
# Management gRPC listener is plaintext loopback; never expose it outside host.
# Industrial client control always enters Commander. Only Commander can call the
# dedicated Gateway simulation execution RPC; Gateway then updates Generator inputs.
# gRPC 限制在 loopback，所有敏感调用必须校验应用令牌。
schema_version: 3
file_version: "1.1.1"
service_id: gateway-e2e-target
config_sources:
  instances:
    devices: e2e-final
grpc:
  listen_host: "127.0.0.1"
  listen_port: 52074
  max_active_rpcs: 64
  sink_listener_port: 52075
  request_max_bytes: 2097152
security:
  callers:
    - caller_id: commander
      token_env: WIND_HUB_E2E_GATEWAY_TARGET_COMMANDER_TOKEN
      permissions: [simulation_execute, read]
    - caller_id: generator
      token_env: WIND_HUB_E2E_GATEWAY_TARGET_GENERATOR_TOKEN
      permissions: [inject, read]
    - caller_id: operator
      token_env: WIND_HUB_E2E_GATEWAY_TARGET_OPERATOR_TOKEN
      permissions: [read, lifecycle, diagnose]
    - caller_id: sink
      token_env: WIND_HUB_E2E_GATEWAY_TARGET_SINK_TOKEN
      permissions: [inject]
servers:
  - server_id: gw-e2e-sink-target
    device_id: WTG_SINK01
    listen_host: "127.0.0.1"
    listen_port: 15121
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []
metrics:
  window_seconds: 60
  collect_interval_ms: 1000

# Service 仅引用 Instance 逻辑身份；Deployment 统一选定不可变文件版本。
# Instance 固定引用 Template，Service 不声明 templates.root。
# Industrial Gateway simulation target, aligned with device_sim_v1.2.0.yaml and
# Data Generator scenario wind-plant-physical.
# Management gRPC listener is plaintext loopback; never expose it outside host.
# Industrial client control always enters Commander. Only Commander can call the
# dedicated Gateway simulation execution RPC; Gateway then updates Generator inputs.
# Provision /etc/wind-hub/certs in deployment or test setup; no keys ship in the repository.
# Configure trusted mTLS certificates and CN permissions before enabling control.
schema_version: 1
file_version: "1.1.3"
service_id: gateway-sim
config_sources:
  instances:
    devices: sim
grpc:
  listen_host: "127.0.0.1"
  listen_port: 50073
  max_active_rpcs: 64
  request_max_bytes: 2097152
  tls:
    enabled: true
    ca_file: /etc/wind-hub/certs/ca.pem
    cert_file: /etc/wind-hub/certs/gateway.pem
    key_file: /etc/wind-hub/certs/gateway.key
  permissions:
    commander: [simulation_execute, read]
    generator: [inject, read]
    operator: [read, lifecycle, diagnose]
servers:
  - server_id: gw-wtg-sim01
    device_id: WTG_SIM01
    listen_host: "127.0.0.1"
    listen_port: 15021
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []
  - server_id: gw-pv-sim01
    device_id: PV_SIM01
    listen_host: "127.0.0.1"
    listen_port: 15022
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []
  - server_id: gw-bess-sim01
    device_id: BESS_SIM01
    listen_host: "127.0.0.1"
    listen_port: 15023
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []
  - server_id: gw-grid-sim01
    device_id: GRID_SIM01
    listen_host: "127.0.0.1"
    listen_port: 15024
    desired_state: START
    control:
      enabled: false
      target:
        kind: none
      mappings: []
  - server_id: gw-ppc-sim01
    device_id: PPC_SIM01
    listen_host: "127.0.0.1"
    listen_port: 15025
    desired_state: START
    control:
      enabled: true
      target:
        kind: commander
        endpoint: "127.0.0.1:50052"
        tls:
          enabled: true
          ca_file: /etc/wind-hub/certs/ca.pem
          cert_file: /etc/wind-hub/certs/gateway.pem
          key_file: /etc/wind-hub/certs/gateway.key
        request_timeout_ms: 2000
        queue_capacity: 1024
        max_inflight: 1
      simulation:
        endpoint: "127.0.0.1:50061"
        tls:
          enabled: true
          ca_file: /etc/wind-hub/certs/ca.pem
          cert_file: /etc/wind-hub/certs/gateway.pem
          key_file: /etc/wind-hub/certs/gateway.key
        scenario_id: wind-plant-physical
      mappings:
        - variable_id: agc_power_setpoint
          target_point_id: agc_power_setpoint
metrics:
  window_seconds: 60
  collect_interval_ms: 1000

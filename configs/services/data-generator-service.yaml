# Data Generator 服务配置；Scenario 变更按运行互斥规则应用，服务运行参数变更需要重启。
schema_version: 1
file_version: "1.0.0"
config_sources:
  instances:
    site: configs/instances/site.yaml
    devices: configs/instances/devices.yaml
  templates:
    root: configs/templates
service:
  grpc_bind: "127.0.0.1:50061"
output:
  max_inflight: 1
  grpc_timeout_seconds: 3.0
buffer:
  max_batches: 128
  max_points_per_batch: 1000
replay:
  read_batch_size: 1000
diagnose:
  max_concurrent: 2
  timeout_seconds: 10.0
  permit_wait_seconds: 0.5
recording:
  enabled: false
  directory: artifacts/data-generator
metrics:
  enabled: true
  sample_seconds: 1.0
  window_seconds: 60
  retain_seconds: 3600
  max_series: 2000

scenarios:
  - scenario_id: demo-random
    version: "1.0.0"
    description: "ADS virtual pitch signal"
    source:
      kind: simulation
      interval_seconds: 1.0
      seed: 42
    devices:
      - device_id: GW01
        points:
          - point_id: a02_dm_pitchangle1
            model:
              kind: random
              distribution: uniform
              minimum: 3.0
              maximum: 15.0
    gateways:
      - gateway_id: gw-test
        endpoint: "127.0.0.1:50051"
        device_id: GW01
      - gateway_id: gw-test-2
        endpoint: "127.0.0.1:50052"
        device_id: GW01
  - scenario_id: demo-replay
    version: "1.0.0"
    description: "Replay pitch signal from CSV"
    source:
      kind: replay
      history_reader: csv
      file: "history/demo.csv"
      start_time: "2026-01-01T00:00:00Z"
      end_time: "2026-01-01T01:00:00Z"
      speed: 1.0
      loop: false
    devices:
      - device_id: GW02
        points:
          - point_id: a02_dm_pitchangle1
    gateways:
      - gateway_id: gw-test
        endpoint: "127.0.0.1:50051"
        device_id: GW02

# 最终联测真值记录默认启用；目录应由测试框架设为隔离可写路径。
# Service 仅引用 Instance 逻辑身份；Deployment 统一选定不可变文件版本。
# Instance 固定引用 Template，Service 不声明 templates.root。
# Scenario 配置由 Instance 提供；此 Service 只声明场景 Instance 身份。
# 设备型号参数来自 templates/device_models，管理端点属于各 Gateway 路由。
schema_version: 2
file_version: "1.1.1"
service_id: data-generator-e2e
config_sources:
  instances:
    site: e2e-final
    devices: e2e-final
    scenarios: e2e-final
service:
  grpc_bind: "127.0.0.1:52061"
output:
  max_inflight: 1
  grpc_timeout_seconds: 3.0
  gateway_token_env: WIND_HUB_E2E_GENERATOR_GATEWAY_TOKEN
buffer:
  max_batches: 128
  max_points_per_batch: 1000
replay:
  read_batch_size: 1000
diagnose:
  max_concurrent: 2
  timeout_seconds: 10.0
  permit_wait_seconds: 0.5
recording:
  enabled: true
  directory: artifacts/e2e-final/data-generator
metrics:
  enabled: true
  sample_seconds: 1.0
  window_seconds: 60
  retain_seconds: 3600
  max_series: 2000

# 无 TLS/mTLS，隔离 loopback + 令牌鉴权。
security:
  callers:
    - caller_id: cli
      token_env: WIND_HUB_E2E_GENERATOR_CLI_TOKEN
      permissions: [variables_read, variables_update]
    - caller_id: gateway
      token_env: WIND_HUB_E2E_GATEWAY_GENERATOR_TOKEN
      permissions: [variables_read, variables_update]

# 版本化场景归属本服务；设备固有参数从 device_models 装配。

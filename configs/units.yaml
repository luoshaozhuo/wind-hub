# ---------------------------------------------------------------------------
# wind-hub 配置模板 — 工程单位目录（工程单位定义的唯一权威来源）
# ---------------------------------------------------------------------------
#
# 本文件定义全部可用工程单位。Point / BusinessPoint 通过 `unit_id` 引用
# 本文件 `units` 的 Mapping Key（Unit ID），代码不内置单位枚举：
#
#     unit_id: kilowatt     # 正确 —— 引用 Unit ID
#     unit_id: kW           # 错误 —— 显示符号不是合法 ID
#
# 概念：
#   Quantity（物理量）：`quantities` 的 Mapping Key。表达业务量类别而不
#     是纯物理量纲——有功/无功/视在功率量纲相同但业务语义不可互换，
#     因此分别建模。每个 Quantity 有且仅有一个基准单位（base_unit），
#     基准单位必须满足 scale_to_base=1、offset_to_base=0。
#   Unit（单位）：`units` 的 Mapping Key。字段：
#     symbol:          工程显示符号（如 kW）；无量纲单位允许空字符串。
#     quantity:        所属 Quantity ID（必填，必须已定义）。
#     scale_to_base:   换算到基准单位的比例 k，有限正数，默认 1。
#     offset_to_base:  换算到基准单位的偏移 b，有限数，默认 0。
#
# 换算规则（仿射变换）：
#     base_value = value * scale_to_base + offset_to_base
#   同一 Quantity 内任意两个单位经共同基准单位换算；跨 Quantity 换算
#   一律拒绝。例如 celsius: base = value * 1 + 273.15（K）。
#
# 与 Point.scale/offset 的区别：Point.scale/offset 把【协议原始值】换算
# 为【该点 unit_id 单位下的工程值】（如 int32 原始值 12345 × 0.001 →
# 12.345 kW）；单位的 scale_to_base/offset_to_base 描述【单位之间】的
# 换算（如 kW → W）。两者作用域不同，不会叠加或重复转换。
#
# 默认值：scale_to_base / offset_to_base 缺省为 1 / 0（恒等变换）。
# `none`（无量纲，空符号）是 Point.unit_id 缺省值；bool/string 点必须
# 使用无量纲且恒等变换的单位。
#
# 新增单位：直接在 `units` 下增加条目即可，无须修改 Python 源码；如新
# 单位属于尚未定义的 Quantity，先在 `quantities` 声明该 Quantity 及其
# 基准单位。校验约束：ID 非空唯一；Unit 必须引用已定义 Quantity；
# base_unit 必须已定义且属于对应 Quantity；base_unit 必须恒等变换；
# scale_to_base 为有限正数；offset_to_base 为有限数；不允许未知字段
# 与重复 Key。单位定义变化属于 restart-required 配置变更，运行中不会
# 被热加载。

quantities:
  dimensionless:
    base_unit: none
  voltage:
    base_unit: volt
  current:
    base_unit: ampere
  active_power:
    base_unit: watt
  reactive_power:
    base_unit: var
  apparent_power:
    base_unit: volt_ampere
  frequency:
    base_unit: hertz
  frequency_rate:
    base_unit: hertz_per_second
  energy:
    base_unit: watt_hour
  electric_charge:
    base_unit: ampere_hour
  length:
    base_unit: meter
  speed:
    base_unit: meter_per_second
  acceleration:
    base_unit: meter_per_second_squared
  angle:
    base_unit: radian
  angular_speed:
    base_unit: radian_per_second
  angular_acceleration:
    base_unit: radian_per_second_squared
  force:
    base_unit: newton
  torque:
    base_unit: newton_meter
  pressure:
    base_unit: pascal
  temperature:
    base_unit: kelvin
  time:
    base_unit: second
  resistance:
    base_unit: ohm
  conductance:
    base_unit: siemens
  capacitance:
    base_unit: farad
  inductance:
    base_unit: henry
  irradiance:
    base_unit: watt_per_square_meter
  irradiation:
    base_unit: watt_hour_per_square_meter
  mass:
    base_unit: kilogram
  volume_flow:
    base_unit: cubic_meter_per_second
  mass_flow:
    base_unit: kilogram_per_second
  density:
    base_unit: kilogram_per_cubic_meter
  humidity:
    base_unit: percent_rh

units:
  # ---- 无量纲 ----
  none:
    symbol: ""
    quantity: dimensionless
  percent:
    symbol: "%"
    quantity: dimensionless
    scale_to_base: 0.01

  # ---- 电压 / 电流 ----
  volt:
    symbol: V
    quantity: voltage
  kilovolt:
    symbol: kV
    quantity: voltage
    scale_to_base: 1000.0
  ampere:
    symbol: A
    quantity: current
  kiloampere:
    symbol: kA
    quantity: current
    scale_to_base: 1000.0

  # ---- 有功 / 无功 / 视在功率 ----
  watt:
    symbol: W
    quantity: active_power
  kilowatt:
    symbol: kW
    quantity: active_power
    scale_to_base: 1000.0
  megawatt:
    symbol: MW
    quantity: active_power
    scale_to_base: 1000000.0
  var:
    symbol: var
    quantity: reactive_power
  kilovar:
    symbol: kvar
    quantity: reactive_power
    scale_to_base: 1000.0
  megavar:
    symbol: Mvar
    quantity: reactive_power
    scale_to_base: 1000000.0
  volt_ampere:
    symbol: VA
    quantity: apparent_power
  kilovolt_ampere:
    symbol: kVA
    quantity: apparent_power
    scale_to_base: 1000.0
  megavolt_ampere:
    symbol: MVA
    quantity: apparent_power
    scale_to_base: 1000000.0

  # ---- 频率及变化率 ----
  hertz:
    symbol: Hz
    quantity: frequency
  hertz_per_second:
    symbol: Hz/s
    quantity: frequency_rate

  # ---- 电能与储能容量 ----
  watt_hour:
    symbol: Wh
    quantity: energy
  kilowatt_hour:
    symbol: kWh
    quantity: energy
    scale_to_base: 1000.0
  megawatt_hour:
    symbol: MWh
    quantity: energy
    scale_to_base: 1000000.0
  ampere_hour:
    symbol: Ah
    quantity: electric_charge
  kiloampere_hour:
    symbol: kAh
    quantity: electric_charge
    scale_to_base: 1000.0
  milliampere_hour:
    symbol: mAh
    quantity: electric_charge
    scale_to_base: 0.001

  # ---- 长度 / 速度 / 加速度 ----
  meter:
    symbol: m
    quantity: length
  millimeter:
    symbol: mm
    quantity: length
    scale_to_base: 0.001
  kilometer:
    symbol: km
    quantity: length
    scale_to_base: 1000.0
  meter_per_second:
    symbol: m/s
    quantity: speed
  kilometer_per_hour:
    symbol: km/h
    quantity: speed
    scale_to_base: 0.2777777777777778
  meter_per_second_squared:
    symbol: m/s²
    quantity: acceleration
  standard_gravity:
    symbol: g
    quantity: acceleration
    scale_to_base: 9.80665

  # ---- 角度 / 角速度 / 角加速度 ----
  radian:
    symbol: rad
    quantity: angle
  degree:
    symbol: "°"
    quantity: angle
    scale_to_base: 0.017453292519943295
  radian_per_second:
    symbol: rad/s
    quantity: angular_speed
  degree_per_second:
    symbol: °/s
    quantity: angular_speed
    scale_to_base: 0.017453292519943295
  rpm:
    symbol: r/min
    quantity: angular_speed
    scale_to_base: 0.10471975511965977
  radian_per_second_squared:
    symbol: rad/s²
    quantity: angular_acceleration
  degree_per_second_squared:
    symbol: °/s²
    quantity: angular_acceleration
    scale_to_base: 0.017453292519943295
  rpm_per_second:
    symbol: r/min/s
    quantity: angular_acceleration
    scale_to_base: 0.10471975511965977

  # ---- 力和转矩 ----
  newton:
    symbol: N
    quantity: force
  kilonewton:
    symbol: kN
    quantity: force
    scale_to_base: 1000.0
  newton_meter:
    symbol: N·m
    quantity: torque
  kilonewton_meter:
    symbol: kN·m
    quantity: torque
    scale_to_base: 1000.0

  # ---- 压力 ----
  pascal:
    symbol: Pa
    quantity: pressure
  kilopascal:
    symbol: kPa
    quantity: pressure
    scale_to_base: 1000.0
  megapascal:
    symbol: MPa
    quantity: pressure
    scale_to_base: 1000000.0
  bar:
    symbol: bar
    quantity: pressure
    scale_to_base: 100000.0

  # ---- 温度 ----
  kelvin:
    symbol: K
    quantity: temperature
  celsius:
    symbol: °C
    quantity: temperature
    offset_to_base: 273.15
  fahrenheit:
    symbol: °F
    quantity: temperature
    scale_to_base: 0.5555555555555556
    offset_to_base: 255.3722222222222

  # ---- 时间 ----
  second:
    symbol: s
    quantity: time
  millisecond:
    symbol: ms
    quantity: time
    scale_to_base: 0.001
  minute:
    symbol: min
    quantity: time
    scale_to_base: 60.0
  hour:
    symbol: h
    quantity: time
    scale_to_base: 3600.0
  day:
    symbol: d
    quantity: time
    scale_to_base: 86400.0

  # ---- 电阻 / 电导 / 电容 / 电感 ----
  ohm:
    symbol: Ω
    quantity: resistance
  kiloohm:
    symbol: kΩ
    quantity: resistance
    scale_to_base: 1000.0
  megaohm:
    symbol: MΩ
    quantity: resistance
    scale_to_base: 1000000.0
  siemens:
    symbol: S
    quantity: conductance
  farad:
    symbol: F
    quantity: capacitance
  millifarad:
    symbol: mF
    quantity: capacitance
    scale_to_base: 0.001
  microfarad:
    symbol: µF
    quantity: capacitance
    scale_to_base: 0.000001
  henry:
    symbol: H
    quantity: inductance
  millihenry:
    symbol: mH
    quantity: inductance
    scale_to_base: 0.001

  # ---- 辐照度 / 辐照量（光伏） ----
  watt_per_square_meter:
    symbol: W/m²
    quantity: irradiance
  kilowatt_per_square_meter:
    symbol: kW/m²
    quantity: irradiance
    scale_to_base: 1000.0
  watt_hour_per_square_meter:
    symbol: Wh/m²
    quantity: irradiation
  kilowatt_hour_per_square_meter:
    symbol: kWh/m²
    quantity: irradiation
    scale_to_base: 1000.0
  megajoule_per_square_meter:
    symbol: MJ/m²
    quantity: irradiation
    scale_to_base: 277.77777777777777

  # ---- 质量 / 流量 / 密度 / 湿度 ----
  kilogram:
    symbol: kg
    quantity: mass
  gram:
    symbol: g
    quantity: mass
    scale_to_base: 0.001
  tonne:
    symbol: t
    quantity: mass
    scale_to_base: 1000.0
  cubic_meter_per_second:
    symbol: m³/s
    quantity: volume_flow
  cubic_meter_per_hour:
    symbol: m³/h
    quantity: volume_flow
    scale_to_base: 0.0002777777777777778
  kilogram_per_second:
    symbol: kg/s
    quantity: mass_flow
  kilogram_per_hour:
    symbol: kg/h
    quantity: mass_flow
    scale_to_base: 0.0002777777777777778
  tonne_per_hour:
    symbol: t/h
    quantity: mass_flow
    scale_to_base: 0.2777777777777778
  kilogram_per_cubic_meter:
    symbol: kg/m³
    quantity: density
  percent_rh:
    symbol: "%RH"
    quantity: humidity

# Core 共享业务量语义目录：按物理量和控制语义分类，不枚举设备具体测点。
# 传感器编号、叶片编号、相别、设备层级和时间统计窗口由 point_tables 表达。
# 业务点不包含协议地址、设备实例编号及访问权限。

# IEC 60870-5-104 客户端协议模板，支持单条 TCP 连接上的多个公共地址 CA。
# 各测点的 CA / IOA 等协议地址属于 point_tables，不在这里填写。
# endpoint.host 由设备实例提供；endpoint.port 缺省 2404。
schema_version: 1
template_id: iec104
file_version: 1.1.0
protocol: iec104
protocol_options:
  # 发送窗口 k、确认窗口 w：均为正整数，并满足 w <= k。
  k: 12
  w: 8
  # t0：TCP 建连超时，单位秒，必须 > 0。
  t0: 5.0
  # t1：I 帧确认超时，单位秒，必须 > 0。
  t1: 5.0
  # t2：监控帧确认等待，单位秒，要求 0 < t2 <= t1。
  t2: 1.0
  # t3：TESTFR 链路保持检测间隔，单位秒，必须 > 0。
  t3: 10.0
  # 单点读 C_RD_NA_1 的业务响应超时，单位秒，必须 > 0。
  read_timeout: 2.0
  # 控制命令每阶段确认超时，单位秒，必须 > 0。
  command_timeout: 3.0
  # 每个 CA 的总召唤业务完成超时，单位秒，必须 > 0。
  interrogation_timeout: 5.0
  # IANA 时区名称（例如 Asia/Shanghai），null 表示不指定。
  # 避免在跨电站共享模板中锁定具体时区。
  timezone: null
  # 应用层健康检查测点 point_id；null 时自动选择可读点。
  health_point: null
  # 每个本地 Listener 的有界接收队列容量，必须为正整数。
  listener_queue_capacity: 256

# 仿真 储能 Modbus TCP 共享点表；仅定义地址/编码，不存放仿真额定参数。
# 版本化模板。新仿真设备实例单独登记，不复用真实现场点表。
# input 只读，holding 仅为允许外部控制的模型输入；非控制内部状态不得外写。
# 32 位值占两个连续寄存器；word_order 由协议模板 modbus_tcp 指定。
schema_version: 1
template_id: modbus_bess_sim
file_version: 1.0.0
protocol: modbus
points:
  soc:
    business_point_id: battery_soc
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 0
      count: 2
      slave_id: 1
    data_type: float32
    unit: percent
    scale: 1.0
    offset: 0.0
    description: "电池实际荷电状态"
  soh:
    business_point_id: battery_soh
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 2
      count: 2
      slave_id: 1
    data_type: float32
    unit: percent
    scale: 1.0
    offset: 0.0
    description: "电池健康状态"
  stored_energy:
    business_point_id: sim_stored_energy
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 4
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt_hour
    scale: 1.0
    offset: 0.0
    description: "电池当前储能"
  available_charge_power:
    business_point_id: sim_available_charge_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 6
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "当前允许充电功率"
  available_discharge_power:
    business_point_id: sim_available_discharge_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 8
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "当前允许放电功率"
  battery_voltage:
    business_point_id: battery_voltage
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 10
      count: 2
      slave_id: 1
    data_type: float32
    unit: volt
    scale: 1.0
    offset: 0.0
    description: "电池直流端电压"
  battery_current:
    business_point_id: battery_current
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 12
      count: 2
      slave_id: 1
    data_type: float32
    unit: ampere
    scale: 1.0
    offset: 0.0
    description: "电池直流电流"
  battery_loss:
    business_point_id: sim_battery_loss
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 14
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "电池内阻损耗"
  battery_temperature:
    business_point_id: battery_temperature
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 16
      count: 2
      slave_id: 1
    data_type: float32
    unit: celsius
    scale: 1.0
    offset: 0.0
    description: "电池温度"
  active_power:
    business_point_id: sim_active_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 18
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "实际交流有功"
  reactive_power:
    business_point_id: sim_reactive_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 20
      count: 2
      slave_id: 1
    data_type: float32
    unit: var
    scale: 1.0
    offset: 0.0
    description: "实际交流无功"
  pcs_current:
    business_point_id: sim_pcs_current
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 22
      count: 2
      slave_id: 1
    data_type: float32
    unit: ampere
    scale: 1.0
    offset: 0.0
    description: "PCS交流电流"
  sim_power_factor:
    business_point_id: power_factor
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 24
      count: 2
      slave_id: 1
    data_type: float32
    unit: power_factor_one
    scale: 1.0
    offset: 0.0
    description: "交流功率因数"
  pcs_status:
    business_point_id: sim_pcs_status
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 26
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "PCS运行状态"
  bms_status:
    business_point_id: sim_bms_status
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 28
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "BMS运行状态"
  fault_status:
    business_point_id: sim_fault_status
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 30
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "故障状态码"
  control_result:
    business_point_id: sim_control_result
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 32
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "上次控制执行结果"
  soc_target:
    business_point_id: sim_soc_target
    point_groups: [all, control]
    address:
      register_type: holding
      address: 0
      count: 2
      slave_id: 1
    data_type: float32
    unit: percent
    scale: 1.0
    offset: 0.0
    description: "目标SOC 非实际SOC"
  active_power_setpoint:
    business_point_id: sim_active_power_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 2
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "外部有功需求"
  reactive_power_setpoint:
    business_point_id: sim_reactive_power_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 4
      count: 2
      slave_id: 1
    data_type: float32
    unit: var
    scale: 1.0
    offset: 0.0
    description: "外部无功需求"

# GW2MW 风机 ADS 点表：基于用户提供的 PLC Symbol 清单筛选。
# 范围：变桨、变流、发电机、轮毂、气象、偏航；包含测量反馈、设定值、限值和阈值。
# Symbol 名称为源文件原文，PLC 标量类型在下方依照业务点约束映射。
# 特别注意：单位、缩放、控制信号读写方向、限值与阈值解释仍需逐项现场核实。
# 数值型别可能与某些源 PLC 类型不符；不能在未核对源文件 typeName 前投入使用。
# index_group/index_offset 由 Core 连接时按 Symbol 解析，不在点表内固化。
# Core 当前将 ADS 点暴露为可读写；本文件并不构成真实 PLC 写权限授权。

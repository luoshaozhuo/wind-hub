      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "电厂可用有功"
  unserved_power_command:
    business_point_id: sim_unserved_power_command
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 25
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "不可满足有功需求"
  agc_enable:
    business_point_id: sim_agc_enable
    point_groups: [all, control]
    address:
      register_type: holding
      address: 0
      count: 1
      slave_id: 1
    data_type: uint16
    unit: none
    scale: 1.0
    offset: 0.0
    description: "启用AGC"
  agc_power_setpoint:
    business_point_id: sim_agc_power_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 1
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "电厂有功目标"
  avc_enable:
    business_point_id: sim_avc_enable
    point_groups: [all, control]
    address:
      register_type: holding
      address: 3
      count: 1
      slave_id: 1
    data_type: uint16
    unit: none
    scale: 1.0
    offset: 0.0
    description: "启用AVC"
  avc_voltage_setpoint:
    business_point_id: sim_avc_voltage_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 4
      count: 2
      slave_id: 1
    data_type: float32
    unit: volt
    scale: 1.0
    offset: 0.0
    description: "PCC目标电压"
  avc_reactive_setpoint:
    business_point_id: sim_avc_reactive_setpoint
    point_groups: [all, control]
    address:
      register_type: holding

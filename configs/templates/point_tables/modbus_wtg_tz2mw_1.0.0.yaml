    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "电网无功功率测量（原始值；工程单位及缩放待确认）"
  # 风速测量；源键 wind_speed_S16；rw=Read；原始数据类型 int16。
  wind_speed:
    business_point_id: tz2mw_wind_speed_raw
    point_groups: [all, meteorology]
    address:
      register_type: input

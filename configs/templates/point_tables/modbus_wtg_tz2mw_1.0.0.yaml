      address: 213
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "10 分钟有功功率测量（原始值；工程单位及缩放待确认）"
  # 电网无功功率测量；源键 measured_reactive_power_S32；rw=Read；原始数据类型 int32。
  measured_reactive_power:
    business_point_id: tz2mw_measured_reactive_power_raw
    point_groups: [all, electrical]
    address:

# TZ2MW 风机 Modbus TCP 点表；来源：plcs_modbus_rw.json。
# 源文件有 3 台机组，10 个测点完全一致，本文件抽取其共享点表。
# 现场 IP/port、设备 ID、key_prefix 属于设备实例；采集周期与 LMDB 路径不是点表属性。
# 源字段映射：fncode=4 -> input(只读)，fncode=3 -> holding(可写)。
# rw=Write 来源于原始系统；当前 Core 的 holding 点按 READ_WRITE 处理，无法仅凭本点表表达只写权限。
# S16/S32 按有符号 int16/int32 保留原始类型；PLC 字序及工程单位未在源文件声明。
# unit=none、scale=1.0、offset=0.0 为未换算的原始寄存器值，不得视为已确认工程单位。
# 实际写入控制前必须确认编码、量程、启停码值、权限与现场联锁。
# 原始设备参数：3 台设备均为 TCP 502、modbus_uid=1；此处仅在点表中记录 slave_id=1。
schema_version: 1
template_id: modbus_wtg_tz2mw
file_version: 1.0.0
protocol: modbus
points:
  # 电网有功功率测量；源键 measured_power_S32；rw=Read；原始数据类型 int32。
  measured_power:
    business_point_id: tz2mw_measured_power_raw
    point_groups: [all, electrical]
    address:
      register_type: input
      address: 187
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "电网有功功率测量（原始值；工程单位及缩放待确认）"
  # 10 分钟有功功率测量；源键 measured_power_10min_S32；rw=Read；原始数据类型 int32。
  measured_power_10min:

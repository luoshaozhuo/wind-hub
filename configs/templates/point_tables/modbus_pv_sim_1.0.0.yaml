# 仿真 光伏 Modbus TCP 共享点表；仅定义地址/编码，不存放仿真额定参数。
# 版本化模板。新仿真设备实例单独登记，不复用真实现场点表。
# input 只读，holding 仅为允许外部控制的模型输入；非控制内部状态不得外写。
# 32 位值占两个连续寄存器；word_order 由协议模板 modbus_tcp 指定。
schema_version: 1
template_id: modbus_pv_sim
file_version: 1.0.0
protocol: modbus
points:
  cell_temperature:
    business_point_id: pv_cell_temperature
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 0
      count: 2
      slave_id: 1
    data_type: float32
    unit: celsius
    scale: 1.0
    offset: 0.0
    description: "光伏电池片温度"
  pv_available_power:
    business_point_id: sim_pv_available_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 2
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "光伏当前可用功率"
  mppt_state:
    business_point_id: sim_mppt_state
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 4
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "MPPT跟踪状态"
  dc_voltage:
    business_point_id: pv_dc_voltage
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 6
      count: 2
      slave_id: 1
    data_type: float32
    unit: volt
    scale: 1.0
    offset: 0.0
    description: "阵列实际直流电压"
  dc_current:
    business_point_id: pv_dc_current
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 8
      count: 2
      slave_id: 1
    data_type: float32
    unit: ampere
    scale: 1.0
    offset: 0.0
    description: "阵列实际直流电流"
  dc_power:
    business_point_id: sim_dc_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 10
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "阵列实际直流功率"
  active_power:
    business_point_id: sim_active_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 12
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "实际交流有功"
  reactive_power:
    business_point_id: sim_reactive_power
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 14
      count: 2
      slave_id: 1
    data_type: float32
    unit: var
    scale: 1.0
    offset: 0.0
    description: "实际交流无功"
  ac_current:
    business_point_id: sim_ac_current
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 16
      count: 2
      slave_id: 1
    data_type: float32
    unit: ampere
    scale: 1.0
    offset: 0.0
    description: "逆变器交流电流"
  sim_power_factor:
    business_point_id: power_factor
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 18
      count: 2
      slave_id: 1
    data_type: float32
    unit: power_factor_one
    scale: 1.0
    offset: 0.0
    description: "交流功率因数"
  inverter_temperature:
    business_point_id: sim_inverter_temperature
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 20
      count: 2
      slave_id: 1
    data_type: float32
    unit: celsius
    scale: 1.0
    offset: 0.0
    description: "逆变器等效温度"
  inverter_status:
    business_point_id: sim_inverter_status
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 22
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "逆变器状态"
  fault_status:
    business_point_id: sim_fault_status
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 24
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "故障状态码"
  control_result:
    business_point_id: sim_control_result
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 26
      count: 2
      slave_id: 1
    data_type: int32
    unit: none
    scale: 1.0
    offset: 0.0
    description: "上次控制执行结果"
  active_power_setpoint:
    business_point_id: sim_active_power_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 0
      count: 2
      slave_id: 1
    data_type: float32
    unit: watt
    scale: 1.0
    offset: 0.0
    description: "外部有功需求"
  reactive_power_setpoint:
    business_point_id: sim_reactive_power_setpoint
    point_groups: [all, control]
    address:
      register_type: holding
      address: 2
      count: 2
      slave_id: 1
    data_type: float32
    unit: var
    scale: 1.0
    offset: 0.0
    description: "外部无功需求"

# 仿真 风机 Modbus TCP 共享点表；仅定义地址/编码，不存放仿真额定参数。
# 版本化模板。新仿真设备实例单独登记，不复用真实现场点表。
# input 只读，holding 仅为允许外部控制的模型输入；非控制内部状态不得外写。
# 32 位值占两个连续寄存器；word_order 由协议模板 modbus_tcp 指定。
schema_version: 1
template_id: modbus_wtg_sim
file_version: 1.0.0
protocol: modbus
points:
  wind_speed:
    business_point_id: wind_speed
    point_groups: [all, measurement]
    address:
      register_type: input
      address: 0
      count: 2
      slave_id: 1
    data_type: float32
    unit: meter_per_second
    scale: 1.0
    offset: 0.0
    description: "轮毂瞬时风速"

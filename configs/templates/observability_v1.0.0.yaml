# 公共观测技术模板；由服务显式读取并装配，不由 Core 搜索固定路径。
# 已发布版本不可原地覆盖；file_version 与文件名保持一致。
schema_version: 1
file_version: 1.0.0
observability:
  logging:
    level: INFO
    format: jsonl
    console: true
    file:
      enabled: false
      path: null
      max_size_mb: 100
      retention_days: 7
    queue_capacity: 10000
  correlation:
    enabled: true
  metrics:
    enabled: false
    buckets_seconds: [0.005, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0]
  tracing:
    enabled: false
    sample_ratio: 0.1
    otlp_endpoint: null

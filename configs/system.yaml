# ---------------------------------------------------------------------------
# wind-hub 配置模板 — 系统（现场身份、运行时参数、ADS 本机身份）
# ---------------------------------------------------------------------------
#
# configs/ 是完整、自包含的配置目录：按现场修改后可作为
# `wind-hub run --config <dir>` 的输入。所有文件都会被加载校验。
#
# 本文件字段：
#
# site（必填，单例）
#   site_id: str，必填 —— 现场唯一标识；一个 wind-hub 运行实例只对应一个现场。
#   name:    str，可选 —— 展示名，缺省等于 site_id。
#
# runtime（可选；None 表示未配置，默认值由各进程补全，见每项注释）
#   queue_maxsize:       int > 0，每个 Sink 的有界队列容量（按批次计），默认 1000。
#   backpressure_policy: drop_old / drop_new / block，队列满时的背压策略，
#                        默认 drop_old。
#   shutdown_timeout:    float > 0（秒），优雅停机等待消费者/资源释放，默认 10。
#   connect_timeout:     float > 0（秒），单设备连接（含重连）超时，默认 1。
#                        作用于应用层连接调度，与协议 protocol_options.timeout
#                        （协议栈单次请求超时）语义不同，两者独立生效。
#   read_timeout:        float > 0（秒），应用层单次批量读外层兜底，默认 1。
#   write_timeout:       float > 0（秒），单次写入默认超时
#                        （Command.timeout <= 0 时生效），默认 1。
#   watchdog_interval:   float > 0（秒），Watchdog 健康检查周期，默认 5。
#   health_timeout:      float > 0（秒），单次健康检查超时，默认 1。
#   thread_pool:         进程级协议命令线程池（asyncio.to_thread 默认
#                        executor），所有协议 Driver 共用，不按设备建池；
#                        每进程引导时安装一次，restart-required，热重载拒绝。
#     max_workers:       int 1..256，默认 32。
#
# logs（可选；统一日志策略，所有进程使用相同 Schema）
#   level: DEBUG / INFO / WARNING / ERROR / CRITICAL，默认 INFO。
#   path: 日志根目录，默认 /var/tmp/wind-hub/logs。
#   console: 是否保留标准错误输出，默认 true。
#   max_size_mb: 单个日志文件上限，默认 100。
#   retention_days: UTC 自然日保留窗口，默认 30。
#
# ads（可选；仅当配置中含 ADS 设备时需要，restart-required，热重载拒绝变更）
#   只描述【本机 AMS 路由器身份】，不含远程 PLC 凭据：
#   远程路由注册凭据（username/password）属于远程 PLC，配置在
#   device_models.yaml / devices.yaml 的 protocol_options 中。
#   local_ams_net_id: 本机 AMS Net ID（6 段点分，如 192.168.1.10.1.2）。
#   local_ip:         本机 IP。
#   request_timeout_ms: ADS 原生请求超时（毫秒），默认 1000。
#   connect_timeout_ms: 单次 ADSDriver 连接流程总等待预算，默认 3000。
#   close_timeout_ms: ADSDriver 关闭的调用方等待预算，默认 3000。
#   应用层超时不终止已经提交的同步 pyads 操作，资源清理后台收敛。
#   Linux / WSL mirrored / 容器下本机作为 AMS 路由器，进程启动时
#   open_port + set_local_address 一次；不使用 ADS 设备时整段删除。
#   下例 127.0.0.1.1.1 / 127.0.0.1 是本机模拟的取值；真实部署或
#   WSL/容器网络下须核实与实际 AMS 路由器、模拟服务器的兼容性，
#   该取值不保证适用于所有环境。

site:
  site_id: my_site
  name: 我的风场

runtime:
  queue_maxsize: 1000
  backpressure_policy: drop_old
  shutdown_timeout: 30.0
  connect_timeout: 10.0
  read_timeout: 5.0
  write_timeout: 5.0
  watchdog_interval: 5.0
  health_timeout: 1.0
  thread_pool:
    max_workers: 32

logs:
  level: INFO
  path: /var/tmp/wind-hub/logs
  console: true
  max_size_mb: 100
  retention_days: 30

ads:
  local_ams_net_id: "127.0.0.1.1.1"
  local_ip: "127.0.0.1"
  request_timeout_ms: 1000
  connect_timeout_ms: 3000
  close_timeout_ms: 3000

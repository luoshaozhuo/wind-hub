# =============================================================================
# 文件：configs/instances/site.yaml
# 用途：站点实例配置，供 Core 共享配置加载器建立 Site。
# 生效范围：整个站点；不定义设备、协议或任务参数。
# 字段说明：
#   schema_version：配置结构版本，当前为整数 1。
#   file_version：当前文件版本，格式为 MAJOR.MINOR.PATCH。
#   site_id：非空站点唯一标识，建议使用英文、数字及下划线。
#   name：站点显示名称；可省略，省略时使用 site_id。
# 本文件正文显式列出当前 Core 支持的全部站点配置字段。
# =============================================================================
schema_version: 1
file_version: 1.0.0
site_id: example_site
name: "本地风电仿真站"

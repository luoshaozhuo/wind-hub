# Data Generator 专属 Scenario Instance；由 Deployment 选择版本。
# 场景运行参数独立于 Device Model；Service 仅引用此 Instance 的逻辑 ID。
# schema_version: 结构版本，固定 1；file_version: MAJOR.MINOR.PATCH。
# scenarios[].scenario_id：场景身份；scenarios[].source：源类型和周期。
# scenarios[].devices：模型设备及变量；scenarios[].gateways：Gateway 端点及映射。
schema_version: 1
file_version: "1.0.0"
scenarios:
  - scenario_id: demo-random
    version: "1.0.0"
    description: "ADS virtual pitch signal"
    source:
      kind: simulation
      interval_seconds: 1.0
      seed: 42
    devices:
      - device_id: GW01
        points:
          - point_id: a02_dm_pitchangle1
            model:
              kind: random
              distribution: uniform
              minimum: 3.0
              maximum: 15.0
    gateways:
      - gateway_id: gw-test
        endpoint: "127.0.0.1:50051"
        device_id: GW01
      - gateway_id: gw-test-2
        endpoint: "127.0.0.1:50052"
        device_id: GW01
  - scenario_id: demo-replay
    version: "1.0.0"
    description: "Replay pitch signal from CSV"
    source:
      kind: replay
      history_reader: csv
      file: "history/demo.csv"
      start_time: "2026-01-01T00:00:00Z"
      end_time: "2026-01-01T01:00:00Z"
      speed: 1.0
      loop: false
    devices:
      - device_id: GW02
        points:
          - point_id: a02_dm_pitchangle1
    gateways:
      - gateway_id: gw-test
        endpoint: "127.0.0.1:50051"
        device_id: GW02

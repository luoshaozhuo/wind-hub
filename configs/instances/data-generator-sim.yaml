# Data Generator 专属仿真场景示例；为阶段 2 的物理模型提供配置输入。
# 额定参数仅属于本文件 scenarios.models.*.parameters，不属于设备型号或 Modbus 点表。
# 当前生产配置解析器尚不支持此目标 Schema；在阶段 2 实现前不可作为运行基线。
# 同一仿真设备不可同时进入多个活动 Generation。
schema_version: 1
file_version: "1.0.0"
scenarios:
  - scenario_id: wind-plant-physical
    version: "1.0.0"
    description: "风光储并网简单物理模型"
    source:
      kind: simulation
      interval_seconds: 0.05
    weather:
      site-a:
        wind:
          wind_seed: 42
          wind_correlation_time_s: 10.0
          wind_speed_mean: 10.0
          turbulence_intensity: 0.12
          wind_direction: 0.0
          air_density: 1.225
        irradiance:
          sunrise_s: 21600
          sunset_s: 64800
          irradiance_clear_w_m2: 1000.0
          cloud_mode: constant
          cloud_factor_target: 0.8
        ambient_temperature:
          temperature_mean_c: 20.0
          diurnal_amplitude_k: 5.0
          temperature_seed: 43
          temperature_tau_s: 1800.0
          temperature_sigma_k: 0.5
          phase_rad: 0.0
    models:
      turbine:
        kind: physical
        device_kind: wtg
        weather_ref: site-a
        controller_mode: ppc
        parameters:
          rated_power_w: 2000000.0
          rated_apparent_power_va: 2200000.0
          rated_wind_speed_m_s: 12.0
          rated_rotor_speed_rad_s: 1.5
          max_rotor_speed_rad_s: 2.0
          cut_in_speed_m_s: 3.0
          cut_out_speed_m_s: 25.0
          rotor_radius_m: 60.0
          rotor_inertia_kg_m2: 4000000.0
          generator_inertia_kg_m2: 600.0
          gear_ratio: 100.0
          lambda_opt: 7.5
          cp_opt: 0.42
          cp_curve:
            - {lambda: 4.0, cp: 0.22}
            - {lambda: 7.5, cp: 0.42}
            - {lambda: 11.0, cp: 0.31}
          generator_efficiency: 0.95
          converter_efficiency: 0.97
          max_generator_torque_nm: 20000.0
          torque_tau_s: 0.5
          pitch_min_rad: 0.0
          pitch_feather_rad: 1.57
          pitch_tau_s: 1.0
          pitch_rate_rad_s: 0.12
          pitch_speed_gain_s: 0.6
          pitch_power_gain_rad_w: 0.0000003
          shaft_damping_nm_s_rad: 1000.0
          yaw_tau_s: 5.0
          yaw_rate_rad_s: 0.03
      solar:
        kind: physical
        device_kind: pv
        weather_ref: site-a
        controller_mode: ppc
        parameters:
          array_peak_power_w: 1000000.0
          inverter_rated_power_w: 900000.0
          inverter_rated_apparent_power_va: 1000000.0
          stc_irradiance_w_m2: 1000.0
          stc_cell_temperature_c: 25.0
          noct_c: 45.0
          power_temp_coefficient_per_k: -0.004
          mppt_voltage_v: 850.0
          open_circuit_voltage_v: 1100.0
          mppt_tau_s: 5.0
          thermal_tau_s: 90.0
          inverter_efficiency: 0.97
      battery:
        kind: physical
        device_kind: bess
        weather_ref: site-a
        controller_mode: ppc
        parameters:
          rated_energy_wh: 1000000.0
          pcs_rated_active_power_w: 500000.0
          pcs_rated_apparent_power_va: 550000.0
          soc_min: 0.1
          soc_max: 0.9
          initial_soc: 0.5
          charge_efficiency: 0.96
          discharge_efficiency: 0.96
          ocv_curve:
            - {soc: 0.1, voltage_v: 700.0}
            - {soc: 0.5, voltage_v: 800.0}
            - {soc: 0.9, voltage_v: 900.0}
          internal_resistance_ohm: 0.05
          max_battery_current_a: 800.0
          initial_battery_temperature_c: 25.0
          control_strategy: power_demand
          soc_control_gain_w: 500000.0
          soc_deadband: 0.005
          reactive_support_enabled: true
          thermal_parameters:
            thermal_capacity_j_per_k: 500000.0
            cooling_w_per_k: 100.0
      grid:
        kind: physical
        device_kind: grid
        parameters:
          nominal_voltage_v: 690.0
          source_voltage_v: 690.0
          nominal_frequency_hz: 50.0
          grid_r_ohm: 0.05
          grid_x_ohm: 0.10
          frequency_mode: external
      plant:
        kind: physical
        device_kind: ppc
        parameters:
          participating_device_ids: [WTG_SIM01, PV_SIM01, BESS_SIM01]
          allocation_weights: {WTG_SIM01: 1.0, PV_SIM01: 1.0, BESS_SIM01: 1.0}
          agc_ramp_w_s: 50000.0
          avc_mode: reactive_power
          ffr_deadband_hz: 0.05
          ffr_droop_w_hz: 300000.0
    devices:
      - device_id: WTG_SIM01
        model_ref: turbine
        points: [wind_speed, effective_wind_speed, yaw_angle, yaw_error, tip_speed_ratio, power_coefficient, pitch_angle_1, pitch_angle_2, pitch_angle_3, pitch_rate_1, pitch_rate_2, pitch_rate_3, sim_rotor_speed, sim_generator_speed, shaft_torque, aerodynamic_power, aerodynamic_torque, available_power, sim_generator_torque, active_power, reactive_power, converter_current, converter_losses, sim_power_factor, generator_temperature, running_status, fault_status, control_result, control_mode, active_power_setpoint, power_limit_setpoint, reactive_power_setpoint]
      - device_id: PV_SIM01
        model_ref: solar
        points: [cell_temperature, pv_available_power, mppt_state, dc_voltage, dc_current, dc_power, active_power, reactive_power, ac_current, sim_power_factor, inverter_temperature, inverter_status, fault_status, control_result, active_power_setpoint, reactive_power_setpoint]
      - device_id: BESS_SIM01
        model_ref: battery
        points: [soc, soh, stored_energy, available_charge_power, available_discharge_power, battery_voltage, battery_current, battery_loss, battery_temperature, active_power, reactive_power, pcs_current, sim_power_factor, pcs_status, bms_status, fault_status, control_result, soc_target, active_power_setpoint, reactive_power_setpoint]
      - device_id: GRID_SIM01
        model_ref: grid
        points: [grid_frequency, frequency_deviation, frequency_rocof, grid_voltage, voltage_deviation, grid_current, sim_apparent_power, active_power, reactive_power, sim_power_factor, grid_status, fault_status, grid_frequency_input, grid_voltage_source, grid_connected]
      - device_id: PPC_SIM01
        model_ref: plant
        points: [active_power_feedback, agc_allocated_power, agc_tracking_error, grid_voltage_feedback, avc_allocated_reactive_power, avc_tracking_error, grid_frequency_feedback, ffr_power_command, ffr_active, frequency_deviation, plant_active_power, plant_reactive_power, plant_available_power, unserved_power_command, agc_enable, agc_power_setpoint, avc_enable, avc_voltage_setpoint, avc_reactive_setpoint, ffr_enable]
    gateways:
      - gateway_id: gw-wtg-sim01
        endpoint: "127.0.0.1:50073"
        feedback_mapping:
          - {device_id: WTG_SIM01, point_id: wind_speed, variable_id: wind_speed}
          - {device_id: WTG_SIM01, point_id: effective_wind_speed, variable_id: effective_wind_speed}
          - {device_id: WTG_SIM01, point_id: yaw_angle, variable_id: yaw_angle}
          - {device_id: WTG_SIM01, point_id: yaw_error, variable_id: yaw_error}
          - {device_id: WTG_SIM01, point_id: tip_speed_ratio, variable_id: tip_speed_ratio}
          - {device_id: WTG_SIM01, point_id: power_coefficient, variable_id: power_coefficient}
          - {device_id: WTG_SIM01, point_id: pitch_angle_1, variable_id: pitch_angle_1}
          - {device_id: WTG_SIM01, point_id: pitch_angle_2, variable_id: pitch_angle_2}
          - {device_id: WTG_SIM01, point_id: pitch_angle_3, variable_id: pitch_angle_3}
          - {device_id: WTG_SIM01, point_id: pitch_rate_1, variable_id: pitch_rate_1}
          - {device_id: WTG_SIM01, point_id: pitch_rate_2, variable_id: pitch_rate_2}
          - {device_id: WTG_SIM01, point_id: pitch_rate_3, variable_id: pitch_rate_3}
          - {device_id: WTG_SIM01, point_id: sim_rotor_speed, variable_id: sim_rotor_speed}
          - {device_id: WTG_SIM01, point_id: sim_generator_speed, variable_id: sim_generator_speed}
          - {device_id: WTG_SIM01, point_id: shaft_torque, variable_id: shaft_torque}
          - {device_id: WTG_SIM01, point_id: aerodynamic_power, variable_id: aerodynamic_power}
          - {device_id: WTG_SIM01, point_id: aerodynamic_torque, variable_id: aerodynamic_torque}
          - {device_id: WTG_SIM01, point_id: available_power, variable_id: available_power}
          - {device_id: WTG_SIM01, point_id: sim_generator_torque, variable_id: sim_generator_torque}
          - {device_id: WTG_SIM01, point_id: active_power, variable_id: active_power}
          - {device_id: WTG_SIM01, point_id: reactive_power, variable_id: reactive_power}
          - {device_id: WTG_SIM01, point_id: converter_current, variable_id: converter_current}
          - {device_id: WTG_SIM01, point_id: converter_losses, variable_id: converter_losses}
          - {device_id: WTG_SIM01, point_id: sim_power_factor, variable_id: sim_power_factor}
          - {device_id: WTG_SIM01, point_id: generator_temperature, variable_id: generator_temperature}
          - {device_id: WTG_SIM01, point_id: running_status, variable_id: running_status}
          - {device_id: WTG_SIM01, point_id: fault_status, variable_id: fault_status}
          - {device_id: WTG_SIM01, point_id: control_result, variable_id: control_result}
          - {device_id: WTG_SIM01, point_id: control_mode, variable_id: control_mode}
          - {device_id: WTG_SIM01, point_id: active_power_setpoint, variable_id: active_power_setpoint}
          - {device_id: WTG_SIM01, point_id: power_limit_setpoint, variable_id: power_limit_setpoint}
          - {device_id: WTG_SIM01, point_id: reactive_power_setpoint, variable_id: reactive_power_setpoint}
      - gateway_id: gw-pv-sim01
        endpoint: "127.0.0.1:50073"
        feedback_mapping:
          - {device_id: PV_SIM01, point_id: cell_temperature, variable_id: cell_temperature}
          - {device_id: PV_SIM01, point_id: pv_available_power, variable_id: pv_available_power}
          - {device_id: PV_SIM01, point_id: mppt_state, variable_id: mppt_state}
          - {device_id: PV_SIM01, point_id: dc_voltage, variable_id: dc_voltage}
          - {device_id: PV_SIM01, point_id: dc_current, variable_id: dc_current}
          - {device_id: PV_SIM01, point_id: dc_power, variable_id: dc_power}
          - {device_id: PV_SIM01, point_id: active_power, variable_id: active_power}
          - {device_id: PV_SIM01, point_id: reactive_power, variable_id: reactive_power}
          - {device_id: PV_SIM01, point_id: ac_current, variable_id: ac_current}
          - {device_id: PV_SIM01, point_id: sim_power_factor, variable_id: sim_power_factor}
          - {device_id: PV_SIM01, point_id: inverter_temperature, variable_id: inverter_temperature}
          - {device_id: PV_SIM01, point_id: inverter_status, variable_id: inverter_status}
          - {device_id: PV_SIM01, point_id: fault_status, variable_id: fault_status}
          - {device_id: PV_SIM01, point_id: control_result, variable_id: control_result}
          - {device_id: PV_SIM01, point_id: active_power_setpoint, variable_id: active_power_setpoint}
          - {device_id: PV_SIM01, point_id: reactive_power_setpoint, variable_id: reactive_power_setpoint}
      - gateway_id: gw-bess-sim01
        endpoint: "127.0.0.1:50073"
        feedback_mapping:
          - {device_id: BESS_SIM01, point_id: soc, variable_id: soc}
          - {device_id: BESS_SIM01, point_id: soh, variable_id: soh}
          - {device_id: BESS_SIM01, point_id: stored_energy, variable_id: stored_energy}
          - {device_id: BESS_SIM01, point_id: available_charge_power, variable_id: available_charge_power}
          - {device_id: BESS_SIM01, point_id: available_discharge_power, variable_id: available_discharge_power}
          - {device_id: BESS_SIM01, point_id: battery_voltage, variable_id: battery_voltage}
          - {device_id: BESS_SIM01, point_id: battery_current, variable_id: battery_current}
          - {device_id: BESS_SIM01, point_id: battery_loss, variable_id: battery_loss}
          - {device_id: BESS_SIM01, point_id: battery_temperature, variable_id: battery_temperature}
          - {device_id: BESS_SIM01, point_id: active_power, variable_id: active_power}
          - {device_id: BESS_SIM01, point_id: reactive_power, variable_id: reactive_power}
          - {device_id: BESS_SIM01, point_id: pcs_current, variable_id: pcs_current}
          - {device_id: BESS_SIM01, point_id: sim_power_factor, variable_id: sim_power_factor}
          - {device_id: BESS_SIM01, point_id: pcs_status, variable_id: pcs_status}
          - {device_id: BESS_SIM01, point_id: bms_status, variable_id: bms_status}
          - {device_id: BESS_SIM01, point_id: fault_status, variable_id: fault_status}
          - {device_id: BESS_SIM01, point_id: control_result, variable_id: control_result}
          - {device_id: BESS_SIM01, point_id: soc_target, variable_id: soc_target}
          - {device_id: BESS_SIM01, point_id: active_power_setpoint, variable_id: active_power_setpoint}
          - {device_id: BESS_SIM01, point_id: reactive_power_setpoint, variable_id: reactive_power_setpoint}
      - gateway_id: gw-grid-sim01
        endpoint: "127.0.0.1:50073"
        feedback_mapping:
          - {device_id: GRID_SIM01, point_id: grid_frequency, variable_id: grid_frequency}
          - {device_id: GRID_SIM01, point_id: frequency_deviation, variable_id: frequency_deviation}
          - {device_id: GRID_SIM01, point_id: frequency_rocof, variable_id: frequency_rocof}
          - {device_id: GRID_SIM01, point_id: grid_voltage, variable_id: grid_voltage}
          - {device_id: GRID_SIM01, point_id: voltage_deviation, variable_id: voltage_deviation}
          - {device_id: GRID_SIM01, point_id: grid_current, variable_id: grid_current}
          - {device_id: GRID_SIM01, point_id: sim_apparent_power, variable_id: sim_apparent_power}
          - {device_id: GRID_SIM01, point_id: active_power, variable_id: active_power}
          - {device_id: GRID_SIM01, point_id: reactive_power, variable_id: reactive_power}
          - {device_id: GRID_SIM01, point_id: sim_power_factor, variable_id: sim_power_factor}
          - {device_id: GRID_SIM01, point_id: grid_status, variable_id: grid_status}
          - {device_id: GRID_SIM01, point_id: fault_status, variable_id: fault_status}
          - {device_id: GRID_SIM01, point_id: grid_frequency_input, variable_id: grid_frequency_input}
          - {device_id: GRID_SIM01, point_id: grid_voltage_source, variable_id: grid_voltage_source}
          - {device_id: GRID_SIM01, point_id: grid_connected, variable_id: grid_connected}
      - gateway_id: gw-ppc-sim01
        endpoint: "127.0.0.1:50073"
        feedback_mapping:
          - {device_id: PPC_SIM01, point_id: active_power_feedback, variable_id: active_power_feedback}
          - {device_id: PPC_SIM01, point_id: agc_allocated_power, variable_id: agc_allocated_power}
          - {device_id: PPC_SIM01, point_id: agc_tracking_error, variable_id: agc_tracking_error}
          - {device_id: PPC_SIM01, point_id: grid_voltage_feedback, variable_id: grid_voltage_feedback}
          - {device_id: PPC_SIM01, point_id: avc_allocated_reactive_power, variable_id: avc_allocated_reactive_power}
          - {device_id: PPC_SIM01, point_id: avc_tracking_error, variable_id: avc_tracking_error}
          - {device_id: PPC_SIM01, point_id: grid_frequency_feedback, variable_id: grid_frequency_feedback}
          - {device_id: PPC_SIM01, point_id: ffr_power_command, variable_id: ffr_power_command}
          - {device_id: PPC_SIM01, point_id: ffr_active, variable_id: ffr_active}
          - {device_id: PPC_SIM01, point_id: frequency_deviation, variable_id: frequency_deviation}
          - {device_id: PPC_SIM01, point_id: plant_active_power, variable_id: plant_active_power}
          - {device_id: PPC_SIM01, point_id: plant_reactive_power, variable_id: plant_reactive_power}
          - {device_id: PPC_SIM01, point_id: plant_available_power, variable_id: plant_available_power}
          - {device_id: PPC_SIM01, point_id: unserved_power_command, variable_id: unserved_power_command}
          - {device_id: PPC_SIM01, point_id: agc_enable, variable_id: agc_enable}
          - {device_id: PPC_SIM01, point_id: agc_power_setpoint, variable_id: agc_power_setpoint}
          - {device_id: PPC_SIM01, point_id: avc_enable, variable_id: avc_enable}
          - {device_id: PPC_SIM01, point_id: avc_voltage_setpoint, variable_id: avc_voltage_setpoint}
          - {device_id: PPC_SIM01, point_id: avc_reactive_setpoint, variable_id: avc_reactive_setpoint}
          - {device_id: PPC_SIM01, point_id: ffr_enable, variable_id: ffr_enable}

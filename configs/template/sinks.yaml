# ---------------------------------------------------------------------------
# wind-hub Sink 配置 — 数据输出目标
# ---------------------------------------------------------------------------
# Task 的 targets 通过 name 引用 Sink。connection 是各 Sink 类型的强类型配置。
# points 用于定义对外点映射与二次 scale/offset；空列表表示当前流式 Sink
# 接收 Task 路由来的全部 PointValue。

sinks:
  - name: kafka_main
    type: kafka
    enabled: false
    connection:
      bootstrap_servers: "localhost:9092"
      topic: wind-hub.raw
    points: []

  - name: db_main
    type: db
    enabled: false
    connection:
      dsn: "postgresql://windhub:windhub@localhost:5432/windhub"
      table: points
      batch_size: 1000
    points: []

  - name: file_archive
    type: file
    enabled: true
    connection:
      path: /var/tmp/wind-hub/archive.jsonl
      format: jsonl
      compress: false
    points: []

  - name: iec104_scada
    type: iec104
    enabled: false
    connection:
      host: "0.0.0.0"
      port: 2404
      common_address: 1
    # 例：
    # points:
    #   - source: {device_id: wtg-001, point_id: active_power}
    #     ref: wtg-001.active_power
    #     datatype: float32
    #     unit: kilowatt
    #     scale: 1.0
    #     offset: 0.0
    #     address: {ioa: 1001, type_id: M_ME_NC_1}
    points: []

  - name: modbus_scada
    type: modbus
    enabled: false
    connection:
      host: "0.0.0.0"
      port: 1502
    # 例：
    # points:
    #   - source: {device_id: wtg-001, point_id: active_power}
    #     ref: wtg-001.active_power
    #     datatype: float32
    #     unit: kilowatt
    #     address:
    #       unit_id: 1
    #       register_type: holding
    #       address: 100
    #       byte_order: big
    #       word_order: big
    points: []

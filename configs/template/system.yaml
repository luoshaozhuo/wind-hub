# ---------------------------------------------------------------------------
# wind-hub 配置模板 — 系统（引擎、ADS 本机、Sink、接口）
# ---------------------------------------------------------------------------
#
# 本目录是完整、自包含的配置模板：复制整个目录后按现场修改即可作为
# `wind-hub run --config <dir>` 的输入。所有文件都会被加载校验。

# 当前现场身份 —— 一个 wind-hub 运行实例只对应一个现场
site:
  site_id: my_site
  name: 我的风场

runtime:
  # 每个 Sink 的内部队列容量（背压阈值）
  queue_maxsize: 1000
  # 背压策略：drop_old（丢最旧）/ drop_new（丢最新）/ block（阻塞）
  backpressure_policy: drop_old
  # 优雅停机超时（秒）
  shutdown_timeout: 30.0
  # 设备连接超时（秒）
  connect_timeout: 10.0
  # 单次读取超时（秒）——一次批量读的应用层外层兜底
  read_timeout: 5.0
  # 单次写入默认超时（秒）——Command.timeout <= 0 时生效
  write_timeout: 5.0

# 进程级 ADS 本机配置（Linux / WSL mirrored / 容器下本机作为 AMS 路由器）
# —— 不属于任何单台 Device；进程启动时 open_port + set_local_address 一次。
# 不使用 ADS 设备时整段删除即可。
ads:
  # 本机（wind-hub 所在主机/容器）AMS Net ID 与 IP
  local_ams_net_id: "192.168.1.10.1.2"
  local_ip: "192.168.1.10"
  username: "Administrator"
  password: ""

sinks:
  # Sink 定义 — Task 的 targets 通过名称引用它们

  - name: kafka_main
    type: kafka
    enabled: false
    params:
      bootstrap_servers: "localhost:9092"
      topic: wind-hub.raw

  - name: db_main
    type: db
    enabled: false
    params:
      dsn: "postgresql://windhub:windhub@localhost:5432/windhub"
      table: points
      batch_size: 1000

  - name: file_archive
    type: file
    enabled: true
    params:
      path: /var/tmp/wind-hub/archive.jsonl
      format: jsonl
      compress: false

interfaces:
  api:
    enabled: true
    host: "127.0.0.1"
    port: 8080

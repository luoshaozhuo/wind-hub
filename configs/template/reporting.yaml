# ---------------------------------------------------------------------------
# wind-hub 配置模板 — IEC104 从站代理（向上级调度主站上报点位）
#
# `reporting` 为空列表（或本文件缺失）即禁用从站代理。
# 启用时把引擎内部的 (device_id, point_id) 映射到 IEC104 信息对象地址
# （ioa）与遥测方向 ASDU 类型：
#
# reporting:
#   - device_id: wtg-001
#     point_id: active_power
#     ioa: 1001
#     data_type: M_ME_NC_1      # 短浮点测量值
#
# data_type 白名单：
#   M_SP_NA_1 / M_DP_NA_1 / M_ME_NA_1 / M_ME_NB_1 / M_ME_NC_1
#   M_SP_TB_1 / M_DP_TB_1 / M_ME_TF_1
# ---------------------------------------------------------------------------

reporting: []
batch_size: 50        # 总召数据每批最多信息对象数
common_address: 1     # IEC104 公共地址（站地址）
host: "127.0.0.1"     # 从站代理监听地址
port: 12404           # 从站代理监听端口

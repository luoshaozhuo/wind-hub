[tool.poetry]
name = "wind-hub"
version = "0.1.0"
description = "风电场主控通信模块：协议无关、输出无关的工业通信内核"
authors = ["luoshaozhuo <luoshaozhuo@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "core", from = "src" },
    { include = "configuration", from = "src" },
    { include = "contracts", from = "src" },
    { include = "collector", from = "src" },
    { include = "sink_service", from = "src" },
    { include = "commander", from = "src" },
    { include = "cli", from = "src" },
    { include = "web_server", from = "src" },
    { include = "industrial_gateway", from = "src" },
    { include = "data_generator", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pyyaml = "^6.0"
typer = "^0.15"
prompt-toolkit = "^3.0"
rich = "^13.0"
dbus-next = "^0.2.3"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
prometheus-client = "^0.21"
grpcio = "^1.75"
protobuf = "^6.32"
pymodbus = "^3.6"
hat-drivers = "^0.10.10"
pyads = "^3.4"
nats-py = "^2.10"
aiokafka = { version = "^0.14", optional = true }
asyncpg = { version = "^0.31", optional = true }
influxdb-client = { version = "^1.48", optional = true }
aiofiles = "^25.1.0"
opentelemetry-api = { version = "^1.30", optional = true }
opentelemetry-sdk = { version = "^1.30", optional = true }
opentelemetry-exporter-otlp-proto-grpc = { version = "^1.30", optional = true }

[tool.poetry.extras]
kafka = ["aiokafka"]
db = ["asyncpg", "influxdb-client"]
tracing = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-grpc"]
all = [
    "aiokafka",
    "asyncpg",
    "influxdb-client",
]

[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.75"
# scripts/generate_rpc.py 经 --mypy_out/--mypy_grpc_out 生成 pb2 类型 stub。
mypy-protobuf = "^5.0"
# REST 系统/契约测试的真实 HTTP 客户端（Server 为 FastAPI 服务）。
httpx = "^0.28"
pytest = "^8.0"
pytest-asyncio = "^0.24"
mypy = "^1.0"
# mypy strict 所需的第三方类型 stub（grpcio 无可用 stub 包，由 pyproject
# overrides 显式按动态类型处理）。
types-protobuf = "^7.0"
types-PyYAML = "^6.0"
ruff = "^0.8"
import-linter = "^2.0"
types-aiofiles = "^25.1.0.20260518"
# IEC104 集成/可靠性测试的真实异构从站（lib60870-C 协议栈），
# 与生产侧 hat.drivers.iec104 主站做跨实现互操作验证。
c104 = "^2.2"

[tool.poetry.scripts]
wind-hub-sink-service = "sink_service.main:main"
wind-hub-collector = "collector.main:main"
wind-hub-commander = "commander.__main__:main"
wind-hub = "cli.main:main"
wind-hub-server = "web_server.main:main"
wind-hub-gateway = "industrial_gateway.main:main"
wind-hub-data-generator = "data_generator.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# protobuf 生成的 *_pb2*.py 及其 mypy-protobuf 生成的 .pyi stub
# 不属于手写源码，不做风格约束。
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# ``fastapi.Query``/``Path``/``Body``/``Depends`` 与 ``typer.Option``/
# ``typer.Argument`` 默认值是声明 CLI/HTTP 参数的框架惯用法；
# B008 不应将其判为默认值函数调用。
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.lint.per-file-ignores]
# gRPC servicer 方法名由 proto service 定义强制（如 StartTask），
# 框架按方法名分发，无法改为 snake_case。
"src/collector/infrastructure/grpc/v2_server.py" = ["N802"]
"src/commander/infrastructure/grpc/server.py" = ["N802"]
"src/industrial_gateway/infrastructure/grpc/data_server.py" = ["N802"]
"src/data_generator/infrastructure/server.py" = ["N802"]
"src/sink_service/infrastructure/grpc_server.py" = ["N802"]
"src/sink_service/infrastructure/realtime_adapters.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "typings/grpc-stubs"

# protobuf 生成的 *_pb2*.py 不是手写源码；类型信息由配套的
# .pyi stub（mypy-protobuf 生成）提供，生成文件本身不做严格检查。
exclude = "(_pb2\\.py|_pb2_grpc\\.py)$"

# grpcio 的公开异步拦截器接口由仓库内首方 partial stub 声明。
# grpc_tools 为生成期工具，不提供运行期类型信息。
[[tool.mypy.overrides]]
module = ["grpc_tools", "grpc_tools.*"]
follow_imports = "skip"
ignore_missing_imports = true

# dbus-next 未附带 py.typed；D-Bus 代理接口方法为运行时动态生成，
# systemd 适配边界的正确性由真实 system bus 测试覆盖。
[[tool.mypy.overrides]]
module = ["dbus_next", "dbus_next.*"]
follow_imports = "skip"
ignore_missing_imports = true

# hat-drivers 未附带 py.typed；协议边界转换集中在 iec104 codec/driver，
# 报文类型正确性由真实从站互通测试覆盖，库侧按动态类型处理。
[[tool.mypy.overrides]]
module = ["hat", "hat.*"]
follow_imports = "skip"
ignore_missing_imports = true

# mypy-protobuf 生成的 .pyi stub 自带 generator 兼容的 ignore/overload
# 形态；这些是生成物特征而非缺陷，不参与手写代码的严格规则。
[[tool.mypy.overrides]]
module = [
    "contracts.common_pb2",
    "contracts.common_pb2_grpc",
    "contracts.collector_pb2",
    "contracts.collector_pb2_grpc",
    "contracts.commander_pb2",
    "contracts.commander_pb2_grpc",
    "contracts.sink_service_pb2",
    "contracts.sink_service_pb2_grpc",
    "contracts.industrial_gateway_pb2",
    "contracts.industrial_gateway_pb2_grpc",
    "contracts.data_generator_pb2",
    "contracts.data_generator_pb2_grpc",
]
disable_error_code = ["unused-ignore", "overload-cannot-match"]

# 测试代码的严格模式例外（明确记录）：测试函数以 pytest fixture 注入
# 依赖，逐参数标注类型是噪音而非价值；monkeypatch 场景下对第三方的
# 无类型调用同理。其余严格规则（arg-type、attr-defined、return-value
# 等真实缺陷信号）对测试仍然生效。
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 层级 marker（由 tests/conftest.py 按第一层目录自动打标）
    "unit: 单函数/单类逻辑，无网络、无真实外部依赖",
    "component: 单进程/单模块内多组件协作（允许 fake/mock 外部依赖）",
    "contract: 模块间稳定契约（RPC/config/API schema 与语义）",
    "integration: 两个以上真实组件协作（真实协议服务/文件/Docker 服务）",
    "system: 完整或接近完整系统的外部可观察行为",
    "reliability: 故障检测、重试、恢复与资源释放",
    "safety: 安全约束（非法输入拒绝、所有权、不伪造结果）",
    "soak: 长时间稳定性（负载、资源、漂移）",
    "performance: 进程内性能基线 pytest 用例（tests/src/performance，无需 root/netem；默认门禁以 marker 排除，经 scripts/ci_gate.py performance 独立触发）",
    # Data Generator 设计 v1_9 §13 表 13-1 专题/场景 marker
    "deterministic: 确定性（seed/顺序独立性）",
    "invalid_input: 非法输入拒绝",
    "time_order: 时间戳与顺序语义",
    "invalid_data: 非法数据/映射拒绝",
    "lifecycle: 源/任务生命周期与回收",
    "overload: 容量、背压与超限",
    "conflict: 版本/所有权冲突",
    "no_targets: 无诊断目标/无映射",
    "contract: Proto/Descriptor 契约",
    "timeout: 超时语义",
    "network_failure: 断线/拒绝/网络故障",
    "invalid_records: 历史数据异常记录",
    "end_to_end: 真实端到端链路",
    "reload: 配置热生效/重载",
    "fault_injection: 故障注入",
    "no_samples: 无样本/空窗口",
    "deadline: 截止时间/取消",
    "restart: 重启/恢复纪元",
    "recovery: 崩溃恢复",
    "concurrency: 并发占用",
    "load: 负载与延迟分布",
    # 协议与外部服务 marker
    "modbus: Modbus 协议相关",
    "ads: ADS 协议相关",
    "iec104: IEC104 协议相关",
    "redis: 需要真实 Redis",
    "influxdb: 需要真实 InfluxDB",
    "file: 文件 sink 相关",
    # 服务真实性与环境 marker
    "real_service: 使用真实外部组件（真实协议栈/文件/Docker 服务）",
    "mock_service: 使用 fake/monkeypatch 替代外部组件（不计入 real-service 验收）",
    "hardware: 需要真实硬件（如 TwinCAT PLC）",
    "docker: 需要 Docker",
    "network: 需要额外网络配置（如 veth/netem）",
    "root: 需要 root 权限",
    "slow: 慢速测试",
    "fast: 快速测试（默认集合）",
    # Commander 专题与场景 marker（保留 main 其它模块注册）
    "security: 认证、授权、身份映射与权限边界（Commander v1_10 §14.2 专题 marker）",
    "normal: 主路径/正常场景",
    "exception: 关键分支与异常输入",
    "storage: 本地存储容量、保留期与清理",
    "field: 授权现场窗口下的真实设备测试",
]

[tool.importlinter]
include_external_packages = true
root_packages = [
    "core",
    "configuration",
    "collector",
    "commander",
    "cli",
    "web_server",
    "industrial_gateway",
    "data_generator",
    "contracts",
]


# ---- new Shared Core boundary ----

[[tool.importlinter.contracts]]
name = "new core 不得依赖进程包"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "collector",
    "commander",
    "cli",
    "web_server",
    "data_generator",
]

[[tool.importlinter.contracts]]
name = "new core 三层依赖方向"
type = "layers"
layers = [
    "core.infrastructure",
    "core.application",
    "core.domain",
]

# ---- 新 Collector / Commander 架构边界 ----
# 新进程包只依赖 core；禁止 import 旧 wind_hub_* 包，禁止互相 import。

[[tool.importlinter.contracts]]
name = "new commander 不得依赖 collector 或 cli"
type = "forbidden"
source_modules = ["commander"]
forbidden_modules = [
    "cli",
    "collector",
]

[[tool.importlinter.contracts]]
name = "new collector 不得依赖 commander 或 cli"
type = "forbidden"
source_modules = ["collector"]
forbidden_modules = [
    "cli",
    "commander",
]

[[tool.importlinter.contracts]]
name = "new commander 三层依赖方向"
type = "layers"
layers = [
    "commander.infrastructure",
    "commander.application",
    "commander.domain",
]

[[tool.importlinter.contracts]]
name = "new collector 三层依赖方向"
type = "layers"
layers = [
    "collector.infrastructure",
    "collector.application",
    "collector.domain",
]

[[tool.importlinter.contracts]]
name = "cli 只依赖 shared core，不依赖进程包"
type = "forbidden"
source_modules = ["cli"]
forbidden_modules = [
    "collector",
    "commander",
]

# ---- Industrial Gateway boundary ----

[[tool.importlinter.contracts]]
name = "industrial gateway 三层依赖方向"
type = "layers"
layers = [
    "industrial_gateway.infrastructure",
    "industrial_gateway.application",
    "industrial_gateway.domain",
]

[[tool.importlinter.contracts]]
name = "industrial gateway 不得依赖其他进程包"
type = "forbidden"
source_modules = ["industrial_gateway"]
forbidden_modules = ["collector", "commander", "cli", "web_server"]

# ---- generated protobuf 边界 ----
# pb2/grpc stub 只允许出现在 grpc inbound/outbound adapter、core rpc codec
# 与 CLI diagnostic adapter；application/domain 不感知 wire 形态。

[[tool.importlinter.contracts]]
name = "new collector/commander application 与 domain 不得依赖生成的 protobuf"
type = "forbidden"
source_modules = [
    "collector.application",
    "collector.domain",
    "commander.application",
    "commander.domain",
]
forbidden_modules = [
    "contracts.collector_pb2",
    "contracts.collector_pb2_grpc",
    "contracts.commander_pb2",
    "contracts.commander_pb2_grpc",
]

[[tool.importlinter.contracts]]
name = "web_server 只通过 core RPC 访问服务"
type = "forbidden"
source_modules = ["web_server"]
forbidden_modules = ["collector", "commander", "cli"]

# ---- Data Generator v1 boundary ----

[[tool.importlinter.contracts]]
name = "data generator 三层依赖方向"
type = "layers"
layers = [
    "data_generator.infrastructure",
    "data_generator.application",
    "data_generator.domain",
]

[[tool.importlinter.contracts]]
name = "data generator 不得依赖其他进程包"
type = "forbidden"
source_modules = ["data_generator"]
forbidden_modules = ["collector", "commander", "cli", "industrial_gateway", "web_server"]

[[tool.importlinter.contracts]]
name = "data generator 业务层不得依赖 wire Proto"
type = "forbidden"
source_modules = ["data_generator.application", "data_generator.domain"]
forbidden_modules = [
    "contracts.common_pb2",
    "contracts.data_generator_pb2",
    "contracts.industrial_gateway_pb2",
]

[[tool.importlinter.contracts]]
name = "configuration 只依赖公共基础库，不依赖进程包"
type = "forbidden"
source_modules = ["configuration"]
forbidden_modules = [
    "collector",
    "commander",
    "cli",
    "web_server",
    "industrial_gateway",
    "data_generator",
    "sink_service",
]

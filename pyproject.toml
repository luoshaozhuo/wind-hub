[tool.poetry]
name = "wind-hub"
version = "0.1.0"
description = "风电场主控通信模块：协议无关、输出无关的工业通信内核"
authors = ["luoshaozhuo <luoshaozhuo@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "wind_hub_collector", from = "src" },
    { include = "wind_hub_server", from = "src" },
    { include = "wind_hub_commander", from = "src" },
    { include = "wind_hub_core", from = "src" },
    { include = "wind_hub_ctl", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pyyaml = "^6.0"
typer = ">=0.15,<1.0"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
structlog = "^24.0"
prometheus-client = "^0.21"
grpcio = "^1.75"
protobuf = "^6.32"
pymodbus = { version = "^3.6", optional = true }
pyads = { version = "^3.4", optional = true }
aiokafka = { version = "^0.14", optional = true }
asyncpg = { version = "^0.31", optional = true }
influxdb-client = { version = "^1.48", optional = true }

[tool.poetry.extras]
ads = ["pyads"]
modbus = ["pymodbus"]
iec104 = []  # 暂无 Python 客户端依赖
kafka = ["aiokafka"]
db = ["asyncpg", "influxdb-client"]
all = [
    "pyads",
    "pymodbus",
    # iec104: no dependencies yet
    "aiokafka",
    "asyncpg",
    "influxdb-client",
]

[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.75"
# scripts/generate_rpc.py 经 --mypy_out/--mypy_grpc_out 生成 pb2 类型 stub。
mypy-protobuf = "^5.0"
# REST 系统/契约测试的真实 HTTP 客户端（Server 为 FastAPI 服务）。
httpx = "^0.28"
pytest = "^8.0"
pytest-asyncio = "^0.24"
mypy = "^1.0"
# mypy strict 所需的第三方类型 stub（grpcio 无可用 stub 包，由 pyproject
# overrides 显式按动态类型处理）。
types-protobuf = "^7.0"
types-PyYAML = "^6.0"
ruff = "^0.8"
import-linter = "^2.0"

[tool.poetry.scripts]
wind-hub-collector = "wind_hub_collector.main:main"
wind-hub-ctl = "wind_hub_ctl.main:main"
wind-hub-server = "wind_hub_server.main:main"
wind-hub-commander = "wind_hub_commander.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# protobuf 生成的 *_pb2*.py 及其 mypy-protobuf 生成的 .pyi stub
# 不属于手写源码，不做风格约束。
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# ``typer.Option``/``typer.Argument`` 与 ``fastapi.Query``/``Path``/``Body``/``Depends``
# 默认值是声明 CLI/HTTP 参数的框架惯用法；B008 不应将其判为默认值函数调用。
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
]

[tool.ruff.lint.per-file-ignores]
# IEC104 测试类名刻意对应协议类型 ID（如 M_SP_NA_1 / C_SC_NA_1），
# 不是常规 CapWords 命名，N801 在此处无意义。
"tests/unit/core/protocol/iec104/test_info_objects.py" = ["N801"]
# gRPC servicer 方法名由 proto service 定义强制（如 StartTask），
# 框架按方法名分发，无法改为 snake_case。
"src/wind_hub_collector/adapter/inbound/grpc/server.py" = ["N802"]
"src/wind_hub_commander/adapter/inbound/grpc/server.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.11"
# protobuf 生成的 *_pb2*.py 不是手写源码；类型信息由配套的
# .pyi stub（mypy-protobuf 生成）提供，生成文件本身不做严格检查。
exclude = "(_pb2\\.py|_pb2_grpc\\.py)$"

# grpcio 未附带 py.typed，且当前环境无法安装 grpcio-stubs；
# 将 grpc 视为动态类型模块（Any），边界类型安全由 pb2 .pyi stub 保证。
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
follow_imports = "skip"
ignore_missing_imports = true

# mypy-protobuf 生成的 .pyi stub 自带 generator 兼容的 ignore/overload
# 形态；这些是生成物特征而非缺陷，不参与手写代码的严格规则。
[[tool.mypy.overrides]]
module = [
    "wind_hub_core.rpc.collector_pb2",
    "wind_hub_core.rpc.collector_pb2_grpc",
    "wind_hub_core.rpc.commander_pb2",
    "wind_hub_core.rpc.commander_pb2_grpc",
]
disable_error_code = ["unused-ignore", "overload-cannot-match"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 层级 marker（由 tests/conftest.py 按第一层目录自动打标）
    "unit: 单函数/单类逻辑，无网络、无真实外部依赖",
    "component: 单进程/单模块内多组件协作（允许 fake/mock 外部依赖）",
    "contract: 模块间稳定契约（RPC/config/API schema 与语义）",
    "integration: 两个以上真实组件协作（真实协议服务/文件/Docker 服务）",
    "system: 完整或接近完整系统的外部可观察行为",
    "reliability: 故障检测、重试、恢复与资源释放",
    "soak: 长时间稳定性（负载、资源、漂移）",
    "performance: 性能压测（需 root + tc netem；不加入默认收集，经 scripts/run_benchmark.py 触发）",
    # 协议与外部服务 marker
    "modbus: Modbus 协议相关",
    "ads: ADS 协议相关",
    "iec104: IEC104 协议相关",
    "kafka: 需要真实 Kafka",
    "postgres: 需要真实 PostgreSQL",
    "influxdb: 需要真实 InfluxDB",
    "file: 文件 sink 相关",
    # 服务真实性与环境 marker
    "real_service: 使用真实外部组件（真实协议栈/文件/Docker 服务）",
    "mock_service: 使用 fake/monkeypatch 替代外部组件（不计入 real-service 验收）",
    "hardware: 需要真实硬件（如 TwinCAT PLC）",
    "docker: 需要 Docker",
    "network: 需要额外网络配置（如 veth/netem）",
    "root: 需要 root 权限",
    "slow: 慢速测试",
    "fast: 快速测试（默认集合）",
]

[tool.importlinter]
root_packages = [
    "wind_hub_core",
    "wind_hub_collector",
    "wind_hub_commander",
    "wind_hub_server",
    "wind_hub_ctl",
]

# ---- 跨包边界（现行正式架构的固化，见各包文件头职责说明）----
# 依赖方向：collector / commander / server / ctl → core；core 无出向依赖。
# 进程间协作一律经 core.rpc 生成的 gRPC 契约，禁止直接 import 对端进程包。

[[tool.importlinter.contracts]]
name = "core 不得依赖任何进程包"
type = "forbidden"
source_modules = ["wind_hub_core"]
forbidden_modules = [
    "wind_hub_collector",
    "wind_hub_commander",
    "wind_hub_server",
    "wind_hub_ctl",
]

[[tool.importlinter.contracts]]
name = "collector 不得依赖 commander / server / ctl"
type = "forbidden"
source_modules = ["wind_hub_collector"]
forbidden_modules = ["wind_hub_commander", "wind_hub_server", "wind_hub_ctl"]

[[tool.importlinter.contracts]]
name = "commander 不得依赖 collector / server / ctl"
type = "forbidden"
source_modules = ["wind_hub_commander"]
forbidden_modules = ["wind_hub_collector", "wind_hub_server", "wind_hub_ctl"]

[[tool.importlinter.contracts]]
name = "server 不得依赖 collector / commander / ctl"
type = "forbidden"
source_modules = ["wind_hub_server"]
forbidden_modules = ["wind_hub_collector", "wind_hub_commander", "wind_hub_ctl"]

[[tool.importlinter.contracts]]
name = "ctl 不得依赖 collector / commander / server"
type = "forbidden"
source_modules = ["wind_hub_ctl"]
forbidden_modules = ["wind_hub_collector", "wind_hub_commander", "wind_hub_server"]

# ---- wind_hub_core.config 内部结构 ----
# 依赖方向：loader → resolver / validation / diff → model；model 为纯 schema 层，
# 不反向依赖。fingerprint 无包内依赖，不参与分层。

[[tool.importlinter.contracts]]
name = "config 内部分层：loader → resolver/validation/diff → model"
type = "layers"
layers = [
    "wind_hub_core.config.loader",
    "wind_hub_core.config.resolver | wind_hub_core.config.validation | wind_hub_core.config.diff",
    "wind_hub_core.config.model",
]

# ---- config public façade ----
# 进程包与 core 其它子包只经 `wind_hub_core.config` façade 访问配置，禁止
# 直接 import config 内部物理模块（model / resolver / validation / loader /
# diff / fingerprint）。仅约束直接 import；façade 自身对内部模块的传导合法。

[[tool.importlinter.contracts]]
name = "生产代码只经 config façade 访问配置"
type = "forbidden"
source_modules = [
    "wind_hub_collector",
    "wind_hub_commander",
    "wind_hub_server",
    "wind_hub_ctl",
    "wind_hub_core.protocol",
    "wind_hub_core.device",
]
forbidden_modules = [
    "wind_hub_core.config.model",
    "wind_hub_core.config.resolver",
    "wind_hub_core.config.validation",
    "wind_hub_core.config.loader",
    "wind_hub_core.config.diff",
    "wind_hub_core.config.fingerprint",
]
allow_indirect_imports = true

# ---- collector 内部分层 ----

[[tool.importlinter.contracts]]
name = "Domain 不得依赖 Adapter 和 Infra"
type = "forbidden"
source_modules = ["wind_hub_collector.domain"]
forbidden_modules = ["wind_hub_collector.adapter", "wind_hub_collector.infra"]

[[tool.importlinter.contracts]]
name = "Domain 不得依赖 Application"
type = "forbidden"
source_modules = ["wind_hub_collector.domain"]
forbidden_modules = ["wind_hub_collector.application"]

[[tool.importlinter.contracts]]
name = "Application 不得依赖 Adapter"
type = "forbidden"
source_modules = ["wind_hub_collector.application"]
forbidden_modules = ["wind_hub_collector.adapter"]

# ---- server application 内部分层 ----
# 依赖方向：adapter → application capability → application port → outbound adapter/infra。
# capability 之间只允许单向依赖（见 layers contract），禁止反向或环。

[[tool.importlinter.contracts]]
name = "server application 不得依赖 adapter / infra"
type = "forbidden"
source_modules = ["wind_hub_server.application"]
forbidden_modules = ["wind_hub_server.adapter", "wind_hub_server.infra"]

[[tool.importlinter.contracts]]
name = "server application 不得依赖生成的 protobuf"
type = "forbidden"
source_modules = ["wind_hub_server.application"]
forbidden_modules = ["wind_hub_core.rpc"]

[[tool.importlinter.contracts]]
name = "server application capability 分层"
type = "layers"
layers = [
    "wind_hub_server.application.app_context",
    "wind_hub_server.application.monitoring | wind_hub_server.application.device | wind_hub_server.application.sink",
    "wind_hub_server.application.task",
    "wind_hub_server.application.config",
    "wind_hub_server.application.worker | wind_hub_server.application.operation",
    "wind_hub_server.application.port",
]

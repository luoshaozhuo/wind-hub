[tool.poetry]
name = "wind-hub"
version = "0.1.0"
description = "风电场主控通信模块：协议无关、输出无关的工业通信内核"
authors = ["luoshaozhuo <luoshaozhuo@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "core", from = "src" },
    { include = "contracts", from = "src" },
    { include = "collector", from = "src" },
    { include = "sink_service", from = "src" },
    { include = "commander", from = "src" },
    { include = "cli", from = "src" },
    { include = "web_server", from = "src" },
    { include = "industrial_gateway", from = "src" },
    { include = "seahorse", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pyyaml = "^6.0"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
prometheus-client = "^0.21"
grpcio = "^1.75"
protobuf = "^6.32"
pymodbus = "^3.6"
hat-drivers = "^0.10.10"
pyads = "^3.4"
nats-py = "^2.10"
aiokafka = { version = "^0.14", optional = true }
asyncpg = { version = "^0.31", optional = true }
influxdb-client = { version = "^1.48", optional = true }
aiofiles = "^25.1.0"

[tool.poetry.extras]
kafka = ["aiokafka"]
db = ["asyncpg", "influxdb-client"]
all = [
    "aiokafka",
    "asyncpg",
    "influxdb-client",
]

[tool.poetry.group.dev.dependencies]
grpcio-tools = "^1.75"
# scripts/generate_rpc.py 经 --mypy_out/--mypy_grpc_out 生成 pb2 类型 stub。
mypy-protobuf = "^5.0"
# REST 系统/契约测试的真实 HTTP 客户端（Server 为 FastAPI 服务）。
httpx = "^0.28"
pytest = "^8.0"
pytest-asyncio = "^0.24"
mypy = "^1.0"
# mypy strict 所需的第三方类型 stub（grpcio 无可用 stub 包，由 pyproject
# overrides 显式按动态类型处理）。
types-protobuf = "^7.0"
types-PyYAML = "^6.0"
ruff = "^0.8"
import-linter = "^2.0"
types-aiofiles = "^25.1.0.20260518"
# IEC104 集成/可靠性测试的真实异构从站（lib60870-C 协议栈），
# 与生产侧 hat.drivers.iec104 主站做跨实现互操作验证。
c104 = "^2.2"

[tool.poetry.scripts]
wind-hub-sink-service = "sink_service.main:main"
wind-hub-sink-diagnostic = "sink_service.diagnostic_cli:main"
wind-hub-sink = "sink_service.management_cli:main"
wind-hub-collector = "collector.main:main"
wind-hub = "cli.main:main"
wind-hub-commander = "commander.main:main"
wind-hub-server = "web_server.main:main"
wind-hub-gateway = "industrial_gateway.main:main"
wind-hub-seahorse = "seahorse.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# protobuf 生成的 *_pb2*.py 及其 mypy-protobuf 生成的 .pyi stub
# 不属于手写源码，不做风格约束。
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# ``fastapi.Query``/``Path``/``Body``/``Depends`` 与 ``typer.Option``/
# ``typer.Argument`` 默认值是声明 CLI/HTTP 参数的框架惯用法；
# B008 不应将其判为默认值函数调用。
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.lint.per-file-ignores]
# gRPC servicer 方法名由 proto service 定义强制（如 StartTask），
# 框架按方法名分发，无法改为 snake_case。
"src/collector/infrastructure/grpc/server.py" = ["N802"]
"src/commander/infrastructure/grpc/server.py" = ["N802"]
"src/industrial_gateway/infrastructure/grpc/data_server.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.11"

# protobuf 生成的 *_pb2*.py 不是手写源码；类型信息由配套的
# .pyi stub（mypy-protobuf 生成）提供，生成文件本身不做严格检查。
exclude = "(_pb2\\.py|_pb2_grpc\\.py)$"

# grpcio 未附带 py.typed，且当前环境无法安装 grpcio-stubs；
# 将 grpc 视为动态类型模块（Any），边界类型安全由 pb2 .pyi stub 保证。
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
follow_imports = "skip"
ignore_missing_imports = true

# hat-drivers 未附带 py.typed；协议边界转换集中在 iec104 codec/driver，
# 报文类型正确性由真实从站互通测试覆盖，库侧按动态类型处理。
[[tool.mypy.overrides]]
module = ["hat", "hat.*"]
follow_imports = "skip"
ignore_missing_imports = true

# mypy-protobuf 生成的 .pyi stub 自带 generator 兼容的 ignore/overload
# 形态；这些是生成物特征而非缺陷，不参与手写代码的严格规则。
[[tool.mypy.overrides]]
module = [
    "contracts.collector_pb2",
    "contracts.collector_pb2_grpc",
    "contracts.commander_pb2",
    "contracts.commander_pb2_grpc",
    "contracts.gateway_pb2",
    "contracts.gateway_pb2_grpc",
    "contracts.sink_pb2",
    "contracts.sink_pb2_grpc",
    "contracts.common_pb2",
]
disable_error_code = ["unused-ignore", "overload-cannot-match"]

# 测试代码的严格模式例外（明确记录）：测试函数以 pytest fixture 注入
# 依赖，逐参数标注类型是噪音而非价值；monkeypatch 场景下对第三方的
# 无类型调用同理。其余严格规则（arg-type、attr-defined、return-value
# 等真实缺陷信号）对测试仍然生效。
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 层级 marker（由 tests/conftest.py 按第一层目录自动打标）
    "unit: 单函数/单类逻辑，无网络、无真实外部依赖",
    "component: 单进程/单模块内多组件协作（允许 fake/mock 外部依赖）",
    "contract: 模块间稳定契约（RPC/config/API schema 与语义）",
    "integration: 两个以上真实组件协作（真实协议服务/文件/Docker 服务）",
    "system: 完整或接近完整系统的外部可观察行为",
    "reliability: 故障检测、重试、恢复与资源释放",
    "soak: 长时间稳定性（负载、资源、漂移）",
    "performance: 性能压测（需 root + tc netem；不加入默认收集，经 scripts/run_benchmark.py 触发）",
    # 协议与外部服务 marker
    "modbus: Modbus 协议相关",
    "ads: ADS 协议相关",
    "iec104: IEC104 协议相关",
    "redis: 需要真实 Redis",
    "influxdb: 需要真实 InfluxDB",
    "file: 文件 sink 相关",
    # 服务真实性与环境 marker
    "real_service: 使用真实外部组件（真实协议栈/文件/Docker 服务）",
    "mock_service: 使用 fake/monkeypatch 替代外部组件（不计入 real-service 验收）",
    "hardware: 需要真实硬件（如 TwinCAT PLC）",
    "docker: 需要 Docker",
    "network: 需要额外网络配置（如 veth/netem）",
    "root: 需要 root 权限",
    "slow: 慢速测试",
    "fast: 快速测试（默认集合）",
]

[tool.importlinter]
root_packages = [
    "core",
    "collector",
    "commander",
    "cli",
    "web_server",
    "industrial_gateway",
    "seahorse",
    "contracts",
]


# ---- new Shared Core boundary ----

[[tool.importlinter.contracts]]
name = "new core 不得依赖进程包"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "collector",
    "commander",
    "cli",
    "web_server",
]

[[tool.importlinter.contracts]]
name = "new core 三层依赖方向"
type = "layers"
layers = [
    "core.infrastructure",
    "core.application",
    "core.domain",
]

# ---- 新 Collector / Commander 架构边界 ----
# 新进程包只依赖 core；禁止 import 旧 wind_hub_* 包，禁止互相 import。

[[tool.importlinter.contracts]]
name = "new commander 不得依赖 collector 或 cli"
type = "forbidden"
source_modules = ["commander"]
forbidden_modules = [
    "cli",
    "collector",
]

[[tool.importlinter.contracts]]
name = "new collector 不得依赖 commander 或 cli"
type = "forbidden"
source_modules = ["collector"]
forbidden_modules = [
    "cli",
    "commander",
]

[[tool.importlinter.contracts]]
name = "new commander 三层依赖方向"
type = "layers"
layers = [
    "commander.infrastructure",
    "commander.application",
    "commander.domain",
]

[[tool.importlinter.contracts]]
name = "new collector 三层依赖方向"
type = "layers"
layers = [
    "collector.infrastructure",
    "collector.application",
    "collector.domain",
]

[[tool.importlinter.contracts]]
name = "cli 只依赖 shared core，不依赖进程包"
type = "forbidden"
source_modules = ["cli"]
forbidden_modules = [
    "collector",
    "commander",
]

# ---- Industrial Gateway boundary ----

[[tool.importlinter.contracts]]
name = "industrial gateway 三层依赖方向"
type = "layers"
layers = [
    "industrial_gateway.infrastructure",
    "industrial_gateway.application",
    "industrial_gateway.domain",
]

[[tool.importlinter.contracts]]
name = "industrial gateway 不得依赖其他进程包"
type = "forbidden"
source_modules = ["industrial_gateway"]
forbidden_modules = ["collector", "commander", "cli", "web_server"]

# ---- generated protobuf 边界 ----
# pb2/grpc stub 只允许出现在 grpc inbound/outbound adapter、core rpc codec
# 与 cli client；application/domain 不感知 wire 形态。

[[tool.importlinter.contracts]]
name = "new collector/commander application 与 domain 不得依赖生成的 protobuf"
type = "forbidden"
source_modules = [
    "collector.application",
    "collector.domain",
    "commander.application",
    "commander.domain",
]
forbidden_modules = [
    "contracts.collector_pb2",
    "contracts.collector_pb2_grpc",
    "contracts.commander_pb2",
    "contracts.commander_pb2_grpc",
]

[[tool.importlinter.contracts]]
name = "web_server 只通过 core RPC 访问服务"
type = "forbidden"
source_modules = ["web_server"]
forbidden_modules = ["collector", "commander", "cli"]

# One Sink Service container = one Main + Realtime + Reliable child processes.
# Set WIND_HUB_SINK_CONFIG_ROOT to a writable directory containing configs/
# and TLS credentials. Configure the NATS endpoint in sink_service.yaml.
services:
  sink-service:
    build:
      context: ../..
      dockerfile: deploy/sink-service/Dockerfile
    image: wind-hub-sink-service:dev
    command:
      - --config-root
      - /etc/wind-hub
      - --service-file
      - configs/services/sink_service.yaml
    volumes:
      - ${WIND_HUB_SINK_CONFIG_ROOT:?Specify writable Sink configuration root}:/etc/wind-hub:rw
    ports:
      - "127.0.0.1:${WIND_HUB_SINK_GRPC_PORT:-50061}:50061"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

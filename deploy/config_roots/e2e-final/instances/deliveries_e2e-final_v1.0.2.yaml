# E2E Delivery Instance: PROTOCOL source is explicitly selected; BUSINESS gated.
# RAW 必须由真实原始载荷支持；BUSINESS 必须先从 Configuration 取得真实 manifest SHA-256。
# BUSINESS 测试由 Fixture 以独立新 Instance 版本生成；不能写入伪 SHA-256 或让基础配置不可启动。
# All four Delivery IDs are isolated and are started explicitly via CLI.
schema_version: 1
file_version: "1.0.2"
revision: "e2e-deliveries-r2"
deliveries:
  e2e_redis_power:
    template_id: realtime_power
    template_version: "1.1.0"
    sink_id: e2e_redis
    desired_state: STOP
    source:
      wind_farm_id: e2e-final
      collector_id: collector-e2e-realtime
      devices: [WTG_SIM01]
      points: [active_power]
    overrides: {}
  e2e_modbus_power:
    template_id: realtime_power
    template_version: "1.1.0"
    sink_id: e2e_modbus
    desired_state: STOP
    source:
      wind_farm_id: e2e-final
      collector_id: collector-e2e-realtime
      devices: [WTG_SIM01]
      points: [active_power]
    overrides: {}
  e2e_gateway_power:
    template_id: realtime_power
    template_version: "1.1.0"
    sink_id: e2e_gateway
    desired_state: STOP
    source:
      wind_farm_id: e2e-final
      collector_id: collector-e2e-realtime
      devices: [WTG_SIM01]
      points: [active_power]
    target_mappings:
      - source_device_id: WTG_SIM01
        source_point_id: active_power
        variable_id: active_power
    overrides: {}
  e2e_kafka_protocol:
    template_id: reliable_history
    template_version: "1.1.0"
    sink_id: e2e_kafka
    desired_state: STOP
    source:
      wind_farm_id: e2e-final
      collector_id: collector-e2e-reliable
      devices: [WTG_SIM01]
      points: [] # complete point table; no partial historical row
    overrides: {}

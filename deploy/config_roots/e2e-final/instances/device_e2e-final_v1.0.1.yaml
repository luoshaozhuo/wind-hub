# 新候选精确引用；历史 Device Instance 原样保留。
# 仅供最终跨模块联测；独立 deployment=e2e-final；禁止生产服务引用。
# 仿真设备专用清单；与真实设备 Instance 使用同一设备 Schema，不包含额定参数。

# 最终联测 Commander；事件 SQLite 目录独立，权限/证明方须由测试环境提供。
# 独立仿真部署的 Service 配置；仅引用仿真 Instance，版本由 e2e-final Deployment 选择。
# Service 仅引用 Instance 逻辑身份；Deployment 统一选定不可变文件版本。
# Instance 固定引用 Template，Service 不声明 templates.root。
# Commander 专属服务配置；共享依赖仅声明直接配置入口
schema_version: 3
file_version: "1.1.0"
service_id: commander-e2e
config_sources:
  instances:
    devices: e2e-final

grpc:
  listen_host: "127.0.0.1"
  listen_port: 52052
  max_active_rpcs: 256

security:
  # 内部 gRPC 令牌认证；恢复必须有独立可信 fencing 证据，缺失时拒绝。
  callers:
    - caller_id: ems
      token_env: WIND_HUB_E2E_COMMANDER_EMS_TOKEN
      permissions: [control, query]
    - caller_id: maintenance
      token_env: WIND_HUB_E2E_COMMANDER_MAINTENANCE_TOKEN
      permissions: [query, reload, recover]
    - caller_id: gateway
      token_env: WIND_HUB_E2E_GATEWAY_COMMANDER_TOKEN
      permissions: [control, query]

simulation_targets:
  PPC_SIM01:
    gateway_id: gw-ppc-sim01
    endpoint: "127.0.0.1:52073"
    token_env: WIND_HUB_E2E_COMMANDER_GATEWAY_TOKEN

dispatcher:
  max_concurrency: 100
  max_pending_per_device: 10
  max_pending_global: 1000
  max_batch_size: 10
  max_request_id_bytes: 128

repository:
  sqlite_path: "/var/lib/wind-hub/e2e-final/commander/events.db"
  max_storage_bytes: 68719476736
  reserved_storage_bytes: 6871947674
  retention_seconds: 1800
  cleanup_interval_seconds: 60
  storage_warning_ratio: 0.80
  admission_stop_ratio: 0.90
  accept_commit_timeout_ms: 10000
  persistence_interval_ms: 50
  persistence_batch_size: 500
  persistence_max_events: 100000

audit:
  nats_servers: ["nats://127.0.0.1:4222"]
  stream: COMMAND_AUDIT
  subject: windhub.commander.audit
  retry_base_ms: 100
  retry_max_ms: 5000

timeouts:
  queue_default_ms: 1000
  write_default_ms: 500
  connect_ms: 3000

shutdown:
  grace_seconds: 10

# 完整精确引用候选；历史版本仍不可变，不应自动选取最新版。
# Deployment 为同一部署域原子选择所有 Service / Instance 的不可变版本。
# schema_version: 1；file_version: MAJOR.MINOR.PATCH；deployment_id: 唯一部署身份。
# services.<service_id>.config_id 必须与映射键一致；file_version 为精确版本。
# instances.<config_type>.<config_id>.file_version 为同部署域的唯一目标版本。
# 实例依赖模板由 Instance 固定引用；Service 不允许直接引用 Template。
schema_version: 1
file_version: "1.4.0"
deployment_id: sim-a
services:
  collector-sim:
    config_id: collector-sim
    file_version: "1.0.0"
  commander-sim:
    config_id: commander-sim
    file_version: "1.2.0"
  gateway-sim:
    config_id: gateway-sim
    file_version: "1.2.0"
  data-generator-sim:
    config_id: data-generator-sim
    file_version: "1.1.0"
  cli-sim:
    config_id: cli-sim
    file_version: "1.5.0"
instances:
  site:
    example_site:
      file_version: "1.1.0"
  device:
    sim:
      file_version: "1.4.0"
  collector_tasks:
    sim:
      file_version: "1.0.0"
  scenario:
    sim:
      file_version: "1.0.4"

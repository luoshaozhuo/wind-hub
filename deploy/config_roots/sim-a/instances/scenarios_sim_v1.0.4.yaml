# Data Generator 专属 Scenario Instance；由 Deployment 选择版本。
# 场景运行参数独立于 Device Model；Service 仅引用此 Instance 的逻辑 ID。
# schema_version: 结构版本，固定 1；file_version: MAJOR.MINOR.PATCH。
# scenarios[].scenario_id：场景身份；scenarios[].source：源类型和周期。
# scenarios[].devices：模型设备及变量；scenarios[].gateways：Gateway 端点及映射。
schema_version: 1
file_version: "1.0.4"
scenarios:
  - scenario_id: wind-plant-physical
    version: "1.0.0"
    description: "风光储并网简单物理模型"
    source:
      kind: simulation
      interval_seconds: 0.05
    weather:
      site-a:
        wind:
          wind_seed: 42
          wind_correlation_time_s: 10.0
          wind_speed_mean: 10.0
          turbulence_intensity: 0.12
          wind_direction: 0.0
          air_density: 1.225
        irradiance:
          sunrise_s: 21600
          sunset_s: 64800
          irradiance_clear_w_m2: 1000.0
          cloud_mode: constant
          cloud_factor_target: 0.8
        ambient_temperature:
          temperature_mean_c: 20.0
          diurnal_amplitude_k: 5.0
          temperature_seed: 43
          temperature_tau_s: 1800.0
          temperature_sigma_k: 0.5
          phase_rad: 0.0
    devices:
      - device_id: WTG_SIM01
        weather_ref: site-a
        controller_mode: ppc
      - device_id: PV_SIM01
        weather_ref: site-a
        controller_mode: ppc
      - device_id: BESS_SIM01
        weather_ref: site-a
        controller_mode: ppc
      - device_id: GRID_SIM01
      - device_id: PPC_SIM01
    gateways:
      - gateway_id: gw-wtg-sim01
        endpoint: "127.0.0.1:53073"
        device_id: WTG_SIM01
        variable_mapping:
          active_power: active_power
          active_power_setpoint: active_power_setpoint
          aerodynamic_power: aerodynamic_power
          aerodynamic_torque: aerodynamic_torque
          available_power: available_power
          control_mode: control_mode
          control_result: control_result
          converter_current: converter_current
          converter_losses: converter_losses
          effective_wind_speed: effective_wind_speed
          fault_status: fault_status
          generator_temperature: generator_temperature
          pitch_angle_1: pitch_angle_1
          pitch_angle_2: pitch_angle_2
          pitch_angle_3: pitch_angle_3
          pitch_rate_1: pitch_rate_1
          pitch_rate_2: pitch_rate_2
          pitch_rate_3: pitch_rate_3
          power_coefficient: power_coefficient
          power_limit_setpoint: power_limit_setpoint
          reactive_power: reactive_power
          reactive_power_setpoint: reactive_power_setpoint
          running_status: running_status
          shaft_torque: shaft_torque
          sim_generator_speed: sim_generator_speed
          sim_generator_torque: sim_generator_torque
          sim_power_factor: sim_power_factor
          sim_rotor_speed: sim_rotor_speed
          tip_speed_ratio: tip_speed_ratio
          wind_speed: wind_speed
          yaw_angle: yaw_angle
          yaw_error: yaw_error
      - gateway_id: gw-pv-sim01
        endpoint: "127.0.0.1:53073"
        device_id: PV_SIM01
        variable_mapping:
          ac_current: ac_current
          active_power: active_power
          active_power_setpoint: active_power_setpoint
          cell_temperature: cell_temperature
          control_result: control_result
          dc_current: dc_current
          dc_power: dc_power
          dc_voltage: dc_voltage
          fault_status: fault_status
          inverter_status: inverter_status
          inverter_temperature: inverter_temperature
          mppt_state: mppt_state
          pv_available_power: pv_available_power
          reactive_power: reactive_power
          reactive_power_setpoint: reactive_power_setpoint
          sim_power_factor: sim_power_factor
      - gateway_id: gw-bess-sim01
        endpoint: "127.0.0.1:53073"
        device_id: BESS_SIM01
        variable_mapping:
          active_power: active_power
          active_power_setpoint: active_power_setpoint
          available_charge_power: available_charge_power
          available_discharge_power: available_discharge_power
          battery_current: battery_current
          battery_loss: battery_loss
          battery_temperature: battery_temperature
          battery_voltage: battery_voltage
          bms_status: bms_status
          control_result: control_result
          fault_status: fault_status
          pcs_current: pcs_current
          pcs_status: pcs_status
          reactive_power: reactive_power
          reactive_power_setpoint: reactive_power_setpoint
          sim_power_factor: sim_power_factor
          soc: soc
          soc_target: soc_target
          soh: soh
          stored_energy: stored_energy
      - gateway_id: gw-grid-sim01
        endpoint: "127.0.0.1:53073"
        device_id: GRID_SIM01
        variable_mapping:
          active_power: active_power
          fault_status: fault_status
          frequency_deviation: frequency_deviation
          frequency_rocof: frequency_rocof
          grid_connected: grid_connected
          grid_current: grid_current
          grid_frequency: grid_frequency
          grid_frequency_input: grid_frequency_input
          grid_status: grid_status
          grid_voltage: grid_voltage
          grid_voltage_source: grid_voltage_source
          reactive_power: reactive_power
          sim_apparent_power: sim_apparent_power
          sim_power_factor: sim_power_factor
          voltage_deviation: voltage_deviation
      - gateway_id: gw-ppc-sim01
        endpoint: "127.0.0.1:53073"
        device_id: PPC_SIM01
        variable_mapping:
          active_power_feedback: active_power_feedback
          agc_allocated_power: agc_allocated_power
          agc_enable: agc_enable
          agc_power_setpoint: agc_power_setpoint
          agc_tracking_error: agc_tracking_error
          avc_allocated_reactive_power: avc_allocated_reactive_power
          avc_enable: avc_enable
          avc_reactive_setpoint: avc_reactive_setpoint
          avc_tracking_error: avc_tracking_error
          avc_voltage_setpoint: avc_voltage_setpoint
          ffr_active: ffr_active
          ffr_enable: ffr_enable
          ffr_power_command: ffr_power_command
          frequency_deviation: frequency_deviation
          grid_frequency_feedback: grid_frequency_feedback
          grid_voltage_feedback: grid_voltage_feedback
          plant_active_power: plant_active_power
          plant_available_power: plant_available_power
          plant_reactive_power: plant_reactive_power
          unserved_power_command: unserved_power_command

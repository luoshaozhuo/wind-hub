syntax = "proto3";

package windhub.collector.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Transitional v1 control-plane contract.
// Struct keeps the first migration step wire-compatible without generated
// repository code; stable messages can replace Struct method-by-method later.
service CollectorRuntimeService {
  rpc GetCollectorInfo(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc GetRuntimeStatus(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc ListTaskInstances(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc GetTaskInstance(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListDevices(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc ReadPoint(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service CollectorControlService {
  rpc StartTaskInstance(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc StopTaskInstance(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc StartAssignedTasks(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc StopAssignedTasks(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc WritePoint(google.protobuf.Struct) returns (google.protobuf.Struct);
}

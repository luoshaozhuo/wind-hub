[tool.poetry]
name = "wind-hub-collector"
version = "0.1.0"
description = "Wind Hub standalone industrial data collector"
authors = ["luoshaozhuo <luoshaozhuo@example.com>"]
packages = [{ include = "wind_hub" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pyyaml = "^6.0"
grpcio = "^1.75"
protobuf = "^6.32"
wind-hub-core = { path = "../wind-hub-core", develop = false }
pymodbus = { version = "^3.6", optional = true }
pyads = { version = "^3.4", optional = true }
aiokafka = { version = "^0.14", optional = true }
asyncpg = { version = "^0.31", optional = true }

[tool.poetry.extras]
ads = ["pyads"]
modbus = ["pymodbus"]
iec104 = []
kafka = ["aiokafka"]
db = ["asyncpg"]
all = ["pyads", "pymodbus", "aiokafka", "asyncpg"]

[tool.poetry.scripts]
wind-hub-collector = "wind_hub.main:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

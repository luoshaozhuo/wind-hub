# 配置示例，仅使用非生产端口与回环地址；现场接入时重新核实点表。
# control_enabled 默认 false。启用时必须设置 control_client_ips 和 control_journal。
redis:
  host: 127.0.0.1
  port: 6379
  refresh_seconds: 0.4
commander:
  target: 127.0.0.1:50052
control_enabled: false
control_client_ips: []
devices:
  - id: turbine_001
    host: 127.0.0.1
    port: 15020
    unit_id: 1
    points:
      - id: active_power
        role: feedback
        area: input
        address: 0
        data_type: float32
        critical: true
        redis_device_id: turbine_001
        redis_point_id: active_power
        key_prefix: points
        max_age_seconds: 3.0
      - id: power_setpoint
        role: command
        writable: true
        area: holding
        address: 100
        data_type: float32
        commander_device_id: turbine_001
        commander_point_id: power_setpoint
        commander_timeout: 1.0

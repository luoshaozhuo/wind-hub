syntax = "proto3";

package windhub.configuration.v1;

import "google/protobuf/timestamp.proto";

message ConfigId {
  string config_type = 1;
  string config_id = 2;
}

message ConfigDocumentInput {
  ConfigId config_id = 1;
  string file_name = 2;
  bytes yaml_bytes = 3;
  string relative_path = 4;
}

message ConfigVersionRef {
  ConfigId config_id = 1;
  string version_id = 2;
  string file_version = 3;
  string content_sha256 = 4;
}

message ValidationIssue {
  string document_id = 1;
  string field_path = 2;
  string error_code = 3;
  string message = 4;
}

message DocumentValidationResult {
  ConfigId config_id = 1;
  uint32 schema_version = 2;
  string file_version = 3;
  string content_sha256 = 4;
}

message ConfigYamlDocument {
  ConfigId config_id = 1;
  string version_id = 2;
  uint32 schema_version = 3;
  string file_version = 4;
  uint64 revision_id = 5;
  string file_name = 6;
  bytes yaml_bytes = 7;
  string content_sha256 = 8;
  string yaml_sha256 = 9;
  string schema_ref = 10;
  string relative_path = 11;
}

message ReferenceEdge {
  string source_version_id = 1;
  string target_version_id = 2;
  string relation = 3;
  ConfigId source_config_id = 4;
  ConfigId target_config_id = 5;
}

enum ReferenceDirection {
  REFERENCE_DIRECTION_UNSPECIFIED = 0;
  REFERENCE_DIRECTION_OUTBOUND = 1;
  REFERENCE_DIRECTION_INBOUND = 2;
}

enum RepositoryStatsScope {
  REPOSITORY_STATS_SCOPE_UNSPECIFIED = 0;
  REPOSITORY_STATS_SCOPE_ALL = 1;
  REPOSITORY_STATS_SCOPE_CONFIG_TYPE = 2;
}

enum BackupState {
  BACKUP_STATE_UNSPECIFIED = 0;
  BACKUP_STATE_QUEUED = 1;
  BACKUP_STATE_RUNNING = 2;
  BACKUP_STATE_SUCCEEDED = 3;
  BACKUP_STATE_FAILED = 4;
  BACKUP_STATE_INTERRUPTED = 5;
}

message BackupTask {
  string task_id = 1;
  BackupState state = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string path = 5;
  uint64 size_bytes = 6;
  string sha256 = 7;
  string error_code = 8;
  string message = 9;
  uint32 database_schema_version = 10;
  bool integrity_verified = 11;
}

message CreateCandidateRequest {
  string request_id = 1;
  optional uint64 expected_revision_id = 2;
  repeated ConfigDocumentInput documents = 3;
  bool validate_only = 4;
}
message CreateCandidateResponse {
  string candidate_id = 1;
  bool valid = 2;
  uint64 base_revision_id = 3;
  repeated ValidationIssue issues = 4;
  repeated DocumentValidationResult document_results = 5;
  string manifest_sha256 = 6;
}

message PublishCandidateRequest {
  string candidate_id = 1;
  optional uint64 expected_revision_id = 2;
  string request_id = 3;
}
message PublishCandidateResponse {
  uint64 revision_id = 1;
  repeated ConfigVersionRef published = 2;
  google.protobuf.Timestamp committed_at = 3;
  bool already_applied = 4;
}

message ListConfigsRequest {
  string config_type = 1;
  string config_id_prefix = 2;
  string module_type = 3;
  optional uint64 revision_id = 4;
  uint32 page_size = 5;
  string page_token = 6;
}
message ConfigSummary {
  ConfigId config_id = 1;
  string recommended_version_id = 2;
  string recommended_file_version = 3;
  uint32 schema_version = 4;
  string content_sha256 = 5;
  bool deprecated = 6;
}
message ListConfigsResponse {
  repeated ConfigSummary items = 1;
  uint64 snapshot_revision_id = 2;
  string next_page_token = 3;
}

message ListConfigVersionsRequest {
  ConfigId config_id = 1;
  bool include_deprecated = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ConfigVersionSummary {
  string version_id = 1;
  string file_version = 2;
  uint32 schema_version = 3;
  string content_sha256 = 4;
  google.protobuf.Timestamp created_at = 5;
  bool deprecated = 6;
  uint64 referenced_by_count = 7;
}
message ListConfigVersionsResponse {
  repeated ConfigVersionSummary versions = 1;
  string next_page_token = 2;
}

message GetConfigRequest {
  ConfigId config_id = 1;
  oneof selector {
    string version_id = 2;
    uint64 revision_id = 3;
  }
}
message GetConfigResponse {
  ConfigYamlDocument document = 1;
}

message GetConfigBundleRequest {
  // Recommended roots at one published revision; mutually exclusive with exact_roots.
  repeated ConfigId roots = 1;
  optional uint64 revision_id = 2;
  optional bool include_dependencies = 3;
  // Immutable historical repository version IDs, independent of recommendations.
  repeated ConfigVersionRef exact_roots = 4;
}
message GetConfigBundleResponse {
  uint64 revision_id = 1;
  repeated ConfigYamlDocument files = 2;
  string manifest_sha256 = 3;
  uint64 total_bytes = 4;
}

message ListReferencesRequest {
  string version_id = 1;
  ReferenceDirection direction = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message ListReferencesResponse {
  repeated ReferenceEdge edges = 1;
  string next_page_token = 2;
}

message SetRecommendedVersionRequest {
  ConfigId config_id = 1;
  string version_id = 2;
  optional uint64 expected_revision_id = 3;
  string request_id = 4;
}
message SetRecommendedVersionResponse {
  uint64 revision_id = 1;
  optional string previous_version_id = 2;
  string recommended_version_id = 3;
  google.protobuf.Timestamp committed_at = 4;
}

message DeprecateConfigVersionRequest {
  string version_id = 1;
  string reason = 2;
  optional uint64 expected_revision_id = 3;
  string request_id = 4;
}
message DeprecateConfigVersionResponse {
  uint64 revision_id = 1;
  string version_id = 2;
  bool deprecated = 3;
  uint64 referencing_versions_count = 4;
  google.protobuf.Timestamp committed_at = 5;
}

message GetRepositoryStatsRequest {
  RepositoryStatsScope scope = 1;
  string config_type = 2;
  bool include_storage = 3;
}
message GetRepositoryStatsResponse {
  uint64 document_count = 1;
  uint64 version_count = 2;
  uint64 revision_count = 3;
  uint64 reference_count = 4;
  uint32 db_schema_version = 5;
  optional uint64 db_file_bytes = 6;
  optional uint64 wal_file_bytes = 7;
  optional uint64 free_disk_bytes = 8;
  google.protobuf.Timestamp observed_at = 9;
  repeated string unavailable_metrics = 10;
}

message CreateBackupRequest {
  string request_id = 1;
  string label = 2;
}
message CreateBackupResponse {
  string task_id = 1;
  BackupState state = 2;
  google.protobuf.Timestamp created_at = 3;
}
message GetBackupTaskRequest {
  string task_id = 1;
}
message GetBackupTaskResponse {
  BackupTask task = 1;
}

// Stable immutable point-interpretation bundle independent of moving recommendations.
message GetPointTableBundleRequest {
  string point_table_id = 1;
  string expected_manifest_sha256 = 2;
}
message GetPointTableBundleResponse {
  string point_table_id = 1;
  string device_type = 2;
  repeated ConfigYamlDocument documents = 3;
  string manifest_sha256 = 4;
}

// The only authoritative reconciliation cursor for all config subscribers.
message GetCurrentRevisionRequest {}
message GetCurrentRevisionResponse {
  uint64 revision_id = 1;
  string manifest_sha256 = 2;
  google.protobuf.Timestamp committed_at = 3;
}

// Query one Deployment-selected Service and its immutable dependency closure.
message GetServiceConfigBundleRequest {
  string deployment_id = 1;
  string service_id = 2;
  uint64 revision_id = 3; // 0 means current published revision
}
message GetServiceConfigBundleResponse {
  uint64 repository_revision_id = 1;
  string target_revision = 2;
  repeated ConfigYamlDocument files = 3;
  string manifest_sha256 = 4;
  uint64 total_bytes = 5;
}

service ConfigurationRepositoryService {
  rpc CreateCandidate(CreateCandidateRequest) returns (CreateCandidateResponse);
  rpc PublishCandidate(PublishCandidateRequest) returns (PublishCandidateResponse);
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);
  rpc ListConfigVersions(ListConfigVersionsRequest) returns (ListConfigVersionsResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc GetConfigBundle(GetConfigBundleRequest) returns (GetConfigBundleResponse);
  rpc GetServiceConfigBundle(GetServiceConfigBundleRequest)
      returns (GetServiceConfigBundleResponse);
  rpc GetPointTableBundle(GetPointTableBundleRequest) returns (GetPointTableBundleResponse);
  rpc GetCurrentRevision(GetCurrentRevisionRequest) returns (GetCurrentRevisionResponse);
  rpc ListReferences(ListReferencesRequest) returns (ListReferencesResponse);
  rpc SetRecommendedVersion(SetRecommendedVersionRequest)
      returns (SetRecommendedVersionResponse);
  rpc DeprecateConfigVersion(DeprecateConfigVersionRequest)
      returns (DeprecateConfigVersionResponse);
  rpc GetRepositoryStats(GetRepositoryStatsRequest) returns (GetRepositoryStatsResponse);
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc GetBackupTask(GetBackupTaskRequest) returns (GetBackupTaskResponse);
}

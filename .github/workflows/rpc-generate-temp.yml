name: Temporary RPC Generation

on:
  push:
    branches: [refactor/production-readiness]
    paths:
      - "src/wind_hub_core/rpc/*.proto"
      - "scripts/generate_rpc.py"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Generate RPC sources
        run: python scripts/generate_rpc.py
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- src/wind_hub_core/rpc/*_pb2.py src/wind_hub_core/rpc/*_pb2.pyi src/wind_hub_core/rpc/*_pb2_grpc.py src/wind_hub_core/rpc/*_pb2_grpc.pyi; then
            echo "generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wind_hub_core/rpc/*_pb2.py src/wind_hub_core/rpc/*_pb2.pyi src/wind_hub_core/rpc/*_pb2_grpc.py src/wind_hub_core/rpc/*_pb2_grpc.pyi
          git commit -m "chore(rpc): regenerate collector protobuf"
          git push origin HEAD:refactor/production-readiness

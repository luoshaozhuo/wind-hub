name: Admin Build

on:
  push:
    paths:
      - 'src/wind-hub-admin/**'
      - '.github/workflows/admin-build.yml'
  pull_request:
    paths:
      - 'src/wind-hub-admin/**'
      - '.github/workflows/admin-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wind-hub-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build

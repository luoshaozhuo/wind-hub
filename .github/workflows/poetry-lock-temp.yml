name: Temporary Poetry Lock Refresh

on:
  push:
    branches: [refactor/production-readiness]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh lock
        run: |
          python -m pip install --upgrade pip poetry
          poetry lock
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore(deps): refresh poetry lock"
          git push origin HEAD:refactor/production-readiness

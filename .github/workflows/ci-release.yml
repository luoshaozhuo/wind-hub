name: CI Release Gate

# Gate 3：全量常规软件验证；hardware/performance/soak 属于独立资格通道。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Release backend
        run: python scripts/ci_gate.py release --part backend

  frontend-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/wind-hub-admin
        run: npx playwright install --with-deps chromium
      - name: Release frontend
        run: python scripts/ci_gate.py release --part frontend

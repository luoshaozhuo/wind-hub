name: Production Qualification Gate
run-name: Soak (bounded reliability) @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run metadata
        shell: bash
        run: |
          {
            echo "### Production Qualification"
            echo "- SHA: `$GITHUB_SHA`"
            echo "- Run: `$GITHUB_RUN_ID`"
            echo "- Runner: `$RUNNER_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Run soak
        id: soak
        shell: bash
        run: |
          mkdir -p artifacts/soak
          # v2 soak 是 tests/src/reliability 下的有界负载/资源释放 pytest 用例；
          # 旧 WIND_HUB_SOAK_PROFILE / 8h/24h 长稳框架已退役，无外部 profile 输入。
          python scripts/ci_gate.py soak \
            --output "artifacts/soak/soak-results-${{ github.sha }}.xml"
      - name: Upload JUnit results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results-${{ github.sha }}
          path: artifacts/soak/*.xml
          if-no-files-found: error
      - name: Final qualification status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.soak.outcome }}" = "success" ] && [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "- Status: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

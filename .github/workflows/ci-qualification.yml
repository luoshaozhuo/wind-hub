name: Production Qualification Gate
run-name: Soak ${{ inputs.soak_profile }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      soak_profile:
        description: soak 档位
        type: choice
        options: [smoke_1h, prerelease_8h, rc_24h]
        default: smoke_1h
      duration_override_s:
        description: 覆盖测量时长（秒，仅验证 soak 路径）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  soak:
    runs-on: [self-hosted, qualification]
    timeout-minutes: 1560
    env:
      WIND_HUB_SOAK_PROFILE: ${{ inputs.soak_profile }}
      WIND_HUB_SOAK_DURATION_S: ${{ inputs.duration_override_s }}
    steps:
      - name: Run metadata
        shell: bash
        run: |
          {
            echo "### Production Qualification"
            echo "- SHA: `$GITHUB_SHA`"
            echo "- Run: `$GITHUB_RUN_ID`"
            echo "- Runner: `$RUNNER_NAME`"
            echo "- Profile: `${{ inputs.soak_profile }}`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Run soak
        id: soak
        run: python scripts/ci_gate.py soak
      - name: Upload soak report
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ github.sha }}-${{ inputs.soak_profile }}
          path: artifacts/soak/
          if-no-files-found: error
      - name: Final qualification status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.soak.outcome }}" = "success" ] && [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "- Status: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

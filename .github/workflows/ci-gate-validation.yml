name: Full Gate Validation

# 临时验证 workflow：仅用于 test/full-gate-validation 分支，
# 显式跑完整 Fast / PR / Release 三层，不依赖 scope 裁剪。

on:
  pull_request:
    branches: [main]

concurrency:
  group: full-gate-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    if: github.head_ref == 'test/full-gate-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Install frontend
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Fast backend static
        run: python scripts/ci_gate.py fast --part backend-static
      - name: Fast backend tests
        run: python scripts/ci_gate.py fast --part backend-tests --targets "unit,component,contract"
      - name: Fast frontend
        run: python scripts/ci_gate.py fast --part frontend

  pr:
    if: github.head_ref == 'test/full-gate-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Install frontend
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/wind-hub-admin
        run: npx playwright install --with-deps chromium
      - name: PR backend targeted full
        run: >-
          python scripts/ci_gate.py pr --targets
          "integration-protocol,integration-rpc,integration-sinks,
          system-acquisition,system-command,system-diagnostics,
          system-reload,system-startup,system-task-control,system-e2e"
      - name: PR frontend E2E
        run: python scripts/ci_gate.py frontend-e2e

  release:
    if: github.head_ref == 'test/full-gate-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Install frontend
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/wind-hub-admin
        run: npx playwright install --with-deps chromium
      - name: Release backend
        run: python scripts/ci_gate.py release --part backend
      - name: Release frontend
        run: python scripts/ci_gate.py release --part frontend

name: CI PR Gate (Lightweight)
on:
  pull_request:
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check merge-tool entry and scope classifier
        run: |
          python -m py_compile scripts/ci_scope.py scripts/ci_gate.py ai_shared/agent_config/skills/merge-branch/scripts/merge.py
          python scripts/ci_scope.py src/core/infrastructure/protocol/ads/driver.py | grep -q 'backend_pr_targets=integration-protocol'
          python scripts/ci_scope.py src/core/infrastructure/sink/file.py | grep -q 'backend_pr_targets=integration-sinks'

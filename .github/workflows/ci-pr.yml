name: CI PR Gate

# 只对产品代码 PR 触发；普通 L1 代码仅做 scope 判定后快速 PASS。
# L2/L3 后端仅运行命中的 integration/system 目录；Playwright 只在当前 E2E 实际覆盖的风险路径变化时运行。

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "poetry.lock"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend_pr_required: ${{ steps.classify.outputs.backend_pr_required }}
      backend_pr_targets: ${{ steps.classify.outputs.backend_pr_targets }}
      frontend_e2e: ${{ steps.classify.outputs.frontend_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify risk scope
        id: classify
        shell: bash
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > /tmp/changed-files.txt
          python scripts/ci_scope.py \
            --file-list /tmp/changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  backend-targeted:
    needs: scope
    if: needs.scope.outputs.backend_pr_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Targeted integration/system tests
        run: python scripts/ci_gate.py pr --targets "${{ needs.scope.outputs.backend_pr_targets }}"

  frontend-e2e:
    needs: scope
    if: needs.scope.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/wind-hub-admin
        run: npx playwright install --with-deps chromium
      - name: Playwright shell E2E
        run: python scripts/ci_gate.py frontend-e2e

  ci-pr-gate:
    if: always()
    needs: [scope, backend-targeted, frontend-e2e]
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      BACKEND: ${{ needs.backend-targeted.result }}
      FRONTEND: ${{ needs.frontend-e2e.result }}
      BACKEND_TARGETS: ${{ needs.scope.outputs.backend_pr_targets }}
      FRONTEND_REQUIRED: ${{ needs.scope.outputs.frontend_e2e }}
    steps:
      - name: Final PR Gate
        shell: bash
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "FAIL: risk scope classification failed"
            exit 1
          fi
          for result in "$BACKEND" "$FRONTEND"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: relevant targeted PR check failed"
              exit 1
            fi
          done
          if [ -z "$BACKEND_TARGETS" ] && [ "$FRONTEND_REQUIRED" != "true" ]; then
            echo "PASS: L1 product change — Fast Gate is sufficient"
          else
            echo "PASS: targeted PR checks completed"
          fi

name: CI PR Gate

# Gate 2 只验证产品代码 PR。
# rules/docs/Agent/CI-tooling 等非产品代码变更不触发本 workflow。

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "poetry.lock"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify product scope
        id: classify
        shell: bash
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > /tmp/changed-files.txt
          python scripts/ci_scope.py \
            --file-list /tmp/changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  backend-integration:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Integration tests
        run: python scripts/ci_gate.py pr --part backend-integration

  backend-system-smoke:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: System smoke
        run: python scripts/ci_gate.py pr --part backend-system

  frontend-e2e-smoke:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/wind-hub-admin
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e smoke
        run: python scripts/ci_gate.py pr --part frontend

  ci-pr-gate:
    if: always()
    needs: [scope, backend-integration, backend-system-smoke, frontend-e2e-smoke]
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      INTEGRATION: ${{ needs.backend-integration.result }}
      SYSTEM: ${{ needs.backend-system-smoke.result }}
      FRONTEND: ${{ needs.frontend-e2e-smoke.result }}
    steps:
      - name: Final PR Gate
        shell: bash
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "FAIL: product scope classification failed"
            exit 1
          fi
          for result in "$INTEGRATION" "$SYSTEM" "$FRONTEND"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: relevant PR Gate job failed"
              exit 1
            fi
          done
          echo "PASS"

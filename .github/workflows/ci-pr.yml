name: CI PR Gate

# Gate 2（PR 门禁，对应《软件交付与CI质量门禁规范》§3）：
#   integration（真实组件协作；Kafka/PostgreSQL 由 tests/fixtures/services
#   的 session fixture 经 Compose 拉起，ubuntu-latest 自带 Docker）
#   + system smoke（startup / e2e 关键链路）
#   + 前端 Playwright E2E smoke。
# Gate 1（ci-fast.yml）不在这里重复执行。

on:
  pull_request:

# PR 更新后取消同一 PR 的过期验证，只验证最新 head SHA。
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Integration tests
        run: python -m pytest tests/integration -q

  backend-system-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: System smoke tests (startup + e2e)
        run: python -m pytest tests/system/startup tests/system/e2e -q

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wind-hub-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e smoke
        run: npm run test:e2e

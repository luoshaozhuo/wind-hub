name: CI PR Gate

# PR 门禁：在 Fast 门禁之上加入真实组件协作层。
# - component：单进程多组件（含真实协议模拟服务）
# - contract：RPC/config/API 契约
# - integration：真实组件 + Docker 服务（Kafka/PostgreSQL 由
#   tests/fixtures/services 的 session fixture 经 Compose 拉起；
#   ubuntu-latest 自带 Docker）
# 前端：admin-build.yml 已有构建门禁，这里补 Vitest 单元层。

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-layers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction
      - name: Component tests
        run: python -m pytest tests/component -q
      - name: Contract tests
        run: python -m pytest tests/contract -q
      - name: Integration tests
        run: python -m pytest tests/integration -q

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wind-hub-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm test

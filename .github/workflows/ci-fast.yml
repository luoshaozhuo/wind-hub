name: CI Fast (Lightweight)
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci-fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate agent tooling syntax
        run: |
          python -m compileall -q scripts/ci_scope.py scripts/ci_gate.py scripts/dev.py ai_shared/agent_config/hooks ai_shared/agent_config/skills/merge-branch/scripts
          python -m json.tool .claude/settings.json > /dev/null
          python -m json.tool .codex/hooks.json > /dev/null

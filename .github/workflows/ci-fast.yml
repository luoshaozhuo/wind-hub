name: CI Fast (Commit Gate)

# Gate 1：静态检查 + unit/component/contract + 前端 Vitest/build。
# 本地 local-fast-gate 与本 workflow 共用 scripts/ci_gate.py 中的命令定义。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Fast backend static
        run: python scripts/ci_gate.py fast --part backend-static

  backend-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Fast backend tests
        run: python scripts/ci_gate.py fast --part backend-tests

  frontend-unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Fast frontend
        run: python scripts/ci_gate.py fast --part frontend

name: CI Fast (Commit Gate)

# 高频快速门禁。按变更层级裁剪 backend unit/component/contract；
# 非产品治理改动不跑产品测试，Python CI/Agent tooling 只做轻量编译与 Ruff。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.classify.outputs.product }}
      backend_static: ${{ steps.classify.outputs.backend_static }}
      backend_fast_required: ${{ steps.classify.outputs.backend_fast_required }}
      backend_fast_targets: ${{ steps.classify.outputs.backend_fast_targets }}
      frontend_fast: ${{ steps.classify.outputs.frontend_fast }}
      tooling: ${{ steps.classify.outputs.tooling }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify change scope
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          git diff --name-only "$base" "$head" > /tmp/changed-files.txt
          python scripts/ci_scope.py \
            --file-list /tmp/changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  tooling-check:
    needs: scope
    if: needs.scope.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lightweight tooling validation
        run: |
          python -m compileall -q scripts ai_shared/agent_config/hooks
          python -m pip install --quiet "ruff==0.8.6"
          python -m ruff check scripts ai_shared/agent_config/hooks

  backend-static:
    needs: scope
    if: needs.scope.outputs.backend_static == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Backend static
        run: python scripts/ci_gate.py fast --part backend-static

  backend-fast-tests:
    needs: scope
    if: needs.scope.outputs.backend_fast_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # architecture contract compares against historical baseline
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Targeted Fast tests
        run: python scripts/ci_gate.py fast --part backend-tests --targets "${{ needs.scope.outputs.backend_fast_targets }}"

  openapi-drift:
    needs: scope
    if: needs.scope.outputs.backend_static == 'true' || needs.scope.outputs.frontend_fast == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Install frontend dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: OpenAPI contract drift check
        run: python scripts/ci_gate.py fast --part openapi-drift

  frontend-fast:
    needs: scope
    if: needs.scope.outputs.frontend_fast == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/wind-hub-admin/package-lock.json
      - name: Install dependencies
        working-directory: src/wind-hub-admin
        run: npm ci
      - name: Frontend Fast
        run: python scripts/ci_gate.py fast --part frontend

  ci-fast-gate:
    if: always()
    needs: [scope, tooling-check, backend-static, backend-fast-tests, openapi-drift, frontend-fast]
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      TOOLING: ${{ needs.tooling-check.result }}
      BACKEND_STATIC: ${{ needs.backend-static.result }}
      BACKEND_TESTS: ${{ needs.backend-fast-tests.result }}
      OPENAPI_DRIFT: ${{ needs.openapi-drift.result }}
      FRONTEND: ${{ needs.frontend-fast.result }}
    steps:
      - name: Final Fast Gate
        shell: bash
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "FAIL: change scope classification failed"
            exit 1
          fi
          for result in "$TOOLING" "$BACKEND_STATIC" "$BACKEND_TESTS" "$OPENAPI_DRIFT" "$FRONTEND"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: relevant Fast check failed"
              exit 1
            fi
          done
          echo "PASS"

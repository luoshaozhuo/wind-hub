name: Core v1 Static Gate

on:
  push:
    branches: [refactor/core-v1]

permissions:
  contents: read

concurrency:
  group: core-v1-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Ruff lint
        run: python -m ruff check src tests scripts
      - name: Ruff format
        run: python -m ruff format --check src tests scripts
      - name: Core and Configuration typing
        run: python -m mypy src/core src/configuration
      - name: Import boundaries
        run: lint-imports

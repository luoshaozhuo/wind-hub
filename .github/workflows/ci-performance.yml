name: Performance Gate
run-name: Performance baseline @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Run performance baseline
        id: performance
        shell: bash
        run: |
          mkdir -p artifacts/performance
          {
            echo "### Performance Qualification"
            echo "- SHA: `$GITHUB_SHA`"
            echo "- Run: `$GITHUB_RUN_ID`"
            echo "- Runner: `$RUNNER_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"
          # v2 性能基线是 tests/src/performance 下的进程内 pytest 用例，
          # 不再使用 root/tc netem 旧 Benchmark；--output 仅产出 JUnit XML。
          python scripts/ci_gate.py performance \
            --output "artifacts/performance/perf-results-${{ github.sha }}.xml"
      - name: Upload JUnit results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: artifacts/performance/*.xml
          if-no-files-found: error
      - name: Final qualification status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.performance.outcome }}" = "success" ] && [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "- Status: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

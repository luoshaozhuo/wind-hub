name: Performance Gate
run-name: Performance ${{ inputs.mode }} @ ${{ github.sha }}

# 性能资格通道（Gate 4 的一部分，《软件交付与CI质量门禁规范》§9）：
# 三协议 × tc netem 场景压测，经 scripts/run_benchmark.py 执行。
# 需要 root / CAP_NET_ADMIN（tc/ip 命令），普通 CI runner 无法执行——
# 必须手动触发到具备网络命名空间权限的 self-hosted runner。
# 权限不足时明确记录 NOT EXECUTED 并以退出码 78 标记，绝不以未执行冒充通过。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 压测规模（quick = 3 场景 × 30s；full = 全矩阵约半小时）
        type: choice
        options: [quick, full]
        default: quick
      duration:
        description: 单场景测量时长（秒，仅 full 模式之外的覆盖项）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, perf-netem]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preflight — performance environment
        id: preflight
        shell: bash
        run: |
          {
            echo "### Performance Qualification"
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(id -u)" != "0" ] && ! capsh --print 2>/dev/null | grep -q cap_net_admin; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "- Status: **NOT EXECUTED** — root/CAP_NET_ADMIN unavailable" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Python
        if: steps.preflight.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.preflight.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Run benchmark
        id: benchmark
        if: steps.preflight.outputs.available == 'true'
        run: |
          args=(--output "perf_report_${{ github.sha }}_${{ inputs.mode }}.md")
          if [ "${{ inputs.mode }}" = "quick" ]; then
            args+=(--quick)
          fi
          if [ -n "${{ inputs.duration }}" ]; then
            args+=(--duration "${{ inputs.duration }}")
          fi
          python scripts/run_benchmark.py "${args[@]}"
      - name: Upload benchmark report
        id: upload
        if: always() && steps.preflight.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.sha }}-${{ inputs.mode }}
          path: |
            perf_report_*.md
            perf_report_*.json
            perf_latency.png
          if-no-files-found: error
      - name: Final qualification status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.preflight.outputs.available }}" != "true" ]; then
            exit 1
          fi
          if [ "${{ steps.benchmark.outcome }}" = "success" ] && [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "- Status: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: **FAIL**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

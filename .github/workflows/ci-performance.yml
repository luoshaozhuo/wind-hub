name: Performance Gate

# 性能资格通道（Gate 4 的一部分，《软件交付与CI质量门禁规范》§9）：
# 三协议 × tc netem 场景压测，经 scripts/run_benchmark.py 执行。
# 需要 root / CAP_NET_ADMIN（tc/ip 命令），普通 CI runner 无法执行——
# 必须手动触发到具备网络命名空间权限的 self-hosted runner。
# 权限不足时明确记录 NOT EXECUTED 并以退出码 78 标记，绝不以未执行冒充通过。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 压测规模（quick = 3 场景 × 30s；full = 全矩阵约半小时）
        type: choice
        options: [quick, full]
        default: quick
      duration:
        description: 单场景测量时长（秒，仅 full 模式之外的覆盖项）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, perf-netem]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard — root / CAP_NET_ADMIN available
        run: |
          if [ "$(id -u)" != "0" ] && ! capsh --print 2>/dev/null | grep -q cap_net_admin; then
            echo "NOT EXECUTED — performance environment unavailable (need root or CAP_NET_ADMIN for tc netem)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 78
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --all-extras --no-interaction
      - name: Run benchmark
        run: |
          args=(--output "perf_report_${{ inputs.mode }}.md")
          if [ "${{ inputs.mode }}" = "quick" ]; then
            args+=(--quick)
          fi
          if [ -n "${{ inputs.duration }}" ]; then
            args+=(--duration "${{ inputs.duration }}")
          fi
          python scripts/run_benchmark.py "${args[@]}"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ inputs.mode }}
          path: |
            perf_report_*.md
            perf_report_*.json
            perf_latency.png
          if-no-files-found: error

# 十台风速各自随机变化；由 Data Generator 主动注入 Gateway。
schema_version: 1
file_version: "1.0.0"
scenarios:
  - scenario_id: dcems-random-ten
    version: "1.0.0"
    description: "ten WTG deterministic random wind speeds"
    source: {kind: simulation, interval_seconds: 0.5, seed: 42}
    models:
      dcems-random:
        kind: random
        seed: 42
        rules:
          wind_speed: {distribution: uniform, minimum: 4.0, maximum: 18.0}
          sim_running_status: {distribution: constant, value: 32}
          sim_active_power: {distribution: uniform, minimum: 200000.0, maximum: 1000000.0}
          sim_reactive_power: {distribution: uniform, minimum: -100000.0, maximum: 100000.0}
          device_fault_active: {distribution: constant, value: false}
          active_power_limit: {distribution: constant, value: 2000.0}
          generator_speed: {distribution: constant, value: 1500.0}
          blade_1_pitch_angle: {distribution: constant, value: 5.0}
          pitch_angle: {distribution: constant, value: 0.0}
          sim_plant_active_power: {distribution: uniform, minimum: 400000.0, maximum: 1200000.0}
          sim_plant_reactive_power: {distribution: uniform, minimum: -250000.0, maximum: 250000.0}
          primary_frequency_mode: {distribution: constant, value: false}
    devices:
      - {device_id: WTG01, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle, sim_plant_active_power, sim_plant_reactive_power, primary_frequency_mode]}
      - {device_id: WTG02, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG03, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG04, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG05, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG06, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG07, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG08, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG09, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
      - {device_id: WTG10, model_ref: dcems-random, points: [wind_speed, sim_running_status, sim_active_power, sim_reactive_power, device_fault_active, active_power_limit, generator_speed, blade_1_pitch_angle, pitch_angle]}
    gateways:
      - gateway_id: dcems-gw-01
        endpoint: "127.0.0.1:52073"
        device_id: WTG01
        variable_mapping:
          wind_speed: wind_speed
          sim_running_status: sim_running_status
          sim_active_power: sim_active_power
          sim_reactive_power: sim_reactive_power
          device_fault_active: device_fault_active
          active_power_limit: active_power_limit
          generator_speed: generator_speed
          blade_1_pitch_angle: blade_1_pitch_angle
          pitch_angle: pitch_angle
          sim_plant_active_power: sim_plant_active_power
          sim_plant_reactive_power: sim_plant_reactive_power
          primary_frequency_mode: primary_frequency_mode
      - gateway_id: dcems-gw-02
        endpoint: "127.0.0.1:52073"
        device_id: WTG02
        variable_mapping: {wind_speed: wind_speed, sim_running_status: sim_running_status, sim_active_power: sim_active_power, sim_reactive_power: sim_reactive_power, device_fault_active: device_fault_active, active_power_limit: active_power_limit, generator_speed: generator_speed, blade_1_pitch_angle: blade_1_pitch_angle, pitch_angle: pitch_angle}

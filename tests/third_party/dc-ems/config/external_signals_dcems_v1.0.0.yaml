# 从 dc-ems 源码核实的外部变量契约，不能以历史数据库没有绑定便假装已接入。
# source: dc-ems/main; ConfigLoader, FactoryPoints, YctpDevice, SyzDevice, FreActPowerFun.
schema_version: 1
file_version: "1.0.0"
required_signals:
  - id: wt_wind_speed
    dcems_device_type: "0"
    dcems_field: emsWinSpd
    semantics: "单机瞬时风速"
    unit: meter_per_second
    industrial_source: confirmed
    first_stage: true
  - id: plant_active_power
    dcems_device_type: "1"
    dcems_field: powAct
    destination: emsSyzAct
    semantics: "并网点有功功率"
    unit: kilowatt
    industrial_source: confirmed
    first_stage: true
  - id: plant_reactive_power
    dcems_device_type: "1"
    dcems_field: powReact
    destination: emsSyzReact
    semantics: "并网点无功功率"
    unit: kilovar
    industrial_source: confirmed
    first_stage: true
  - id: pfr_mode
    dcems_device_type: "2"
    dcems_field: isFreMode
    destination: emsIsFreMod
    semantics: "一次调频激活模式"
    unit: none
    industrial_source: confirmed
    first_stage: true
  - id: agc_grid_target
    dcems_device_type: factory
    dcems_field: emsGridDispatchAct
    semantics: "电网 AGC 有功目标"
    unit: kilowatt
    industrial_source: missing_factory_input_adapter
    first_stage: false
  - id: pfr_target_power
    dcems_device_type: factory
    dcems_field: emsFreDst
    semantics: "一次调频目标有功功率，不能替换成电网频率"
    unit: kilowatt
    industrial_source: missing_factory_input_adapter
    first_stage: false
  - id: pfr_delta_power
    dcems_device_type: factory
    dcems_field: emsDeltapValue
    semantics: "一次调频外部增量功率，可选但存在有效哨兵值判据"
    unit: kilowatt
    industrial_source: missing_factory_input_adapter
    first_stage: false
  - id: grid_frequency
    dcems_device_type: factory
    dcems_field: null
    semantics: "真实电网频率，现有 FreActPowerFun 不直接消费该测量值"
    unit: hertz
    industrial_source: needs_algorithm_input_design
    first_stage: false
  - id: agc_enabled
    dcems_device_type: config
    dcems_field: emsActPowerEnable
    semantics: "AGC 全场控制功能总使能"
    unit: none
    industrial_source: internal_config
    first_stage: false
  - id: pfr_enabled
    dcems_device_type: config
    dcems_field: bFreCtrlEnableFlag
    semantics: "一次调频功能总使能"
    unit: none
    industrial_source: internal_config
    first_stage: false

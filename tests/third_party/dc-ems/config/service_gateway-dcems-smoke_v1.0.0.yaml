# Gateway point key 由 BusinessPoint 名称组成；DCEMS 通过实际 Modbus 地址读取。
schema_version: 3
file_version: "1.0.0"
service_id: gateway-dcems-smoke
config_sources:
  instances: {devices: dcems-smoke}
grpc: {listen_host: "127.0.0.1", listen_port: 52073, max_active_rpcs: 64, request_max_bytes: 2097152}
security:
  callers:
    - {caller_id: generator, token_env: WIND_HUB_DCE_GENERATOR_GATEWAY_TOKEN, permissions: [inject, read]}
    - {caller_id: operator, token_env: WIND_HUB_DCE_GATEWAY_OPERATOR_TOKEN, permissions: [read, lifecycle, diagnose]}
servers:
  - server_id: dcems-gw-01
    device_id: WTG01
    listen_host: "127.0.0.1"
    listen_port: 15221
    desired_state: START
    control: {enabled: false, target: {kind: none}, mappings: []}

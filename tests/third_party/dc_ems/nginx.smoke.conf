# 仅用于本机隔离联测；bridge 网络内 Server 原始 HTTPS 端口 443。
server {
    listen 18080;
    server_name localhost;
    client_max_body_size 10m;

    location = / {
        return 302 /dc-ems/;
    }
    location /dc-ems/ {
        alias /usr/share/nginx/html/dc-ems/;
        try_files $uri $uri/ /dc-ems/index.html;
    }
    location /api/ws {
        proxy_pass https://dc-ems-server:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass https://dc-ems-server:443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
    location /file/ {
        proxy_pass https://dc-ems-server:443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
}

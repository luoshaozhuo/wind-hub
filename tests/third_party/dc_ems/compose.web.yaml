# 仅限隔离联测：使用本机已有镜像，不从远端拉取。
# 调用：docker compose -f third_party/dc-ems/runtime/containerized/compose.yaml
#                 -f tests/third_party/dc_ems/compose.web.yaml config
name: dcems-smoke
services:
  dc-ems-server:
    network_mode: !reset ""
    ports:
      - "18443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${DCEMS_TEST_SEED:?set absolute path to derived data.json}
        target: /opt/dc-ems/data.json
        read_only: true
  dc-ems-web:
    image: ${WEB_IMAGE:?set released DCEMS Web image tag}
    pull_policy: never
    network_mode: !reset ""
    ports:
      - "18080:18080"
    volumes:
      - type: bind
        source: ${DCEMS_TEST_DIR:?set the absolute tests/third_party/dc_ems path}/nginx.smoke.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${DCEMS_TEST_WEB:?set absolute path to the staged Web assets}
        target: /usr/share/nginx/html/dc-ems
        read_only: true
    depends_on:
      - dc-ems-server
    restart: "no"

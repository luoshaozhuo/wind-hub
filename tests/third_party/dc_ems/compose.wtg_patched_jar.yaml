# 仅用于 FactoryPoints 运行时复测：将隔离构建的派生 JAR 只读覆盖到 Server。
# 不修改正式发布镜像；源码树编译与发布 FactoryPoints.class 逐字节一致，
# 因此“发布 JAR + 补丁类”等价于完整补丁构建。
services:
  dc-ems-server:
    volumes:
      - type: bind
        source: ${DCEMS_WTG_PATCHED_JAR:?set absolute path to derived patched jar}
        target: /opt/dc-ems/dc-ems.jar
        read_only: true

# Core 共享业务量语义目录：按物理量和控制语义分类，不枚举设备具体测点。
# 业务身份必须区分叶片、通道、物理位置、统计窗口、设定值及反馈值。
# 本版包含 GW2MW 待 OEM 核准候选身份；不能以唯一性代替物理语义验收。
# 业务点不包含协议地址、设备实例编号及访问权限。

schema_version: 2
file_version: "1.0.0"
service_id: data-generator-dcems-smoke
config_sources:
  instances: {site: dcems-smoke, devices: dcems-smoke, scenarios: dcems-smoke}
service: {grpc_bind: "127.0.0.1:52061"}
output: {max_inflight: 1, grpc_timeout_seconds: 3.0, gateway_token_env: WIND_HUB_DCE_GENERATOR_GATEWAY_TOKEN}
buffer: {max_batches: 128, max_points_per_batch: 1000}
replay: {read_batch_size: 1000}
diagnose: {max_concurrent: 2, timeout_seconds: 10.0, permit_wait_seconds: 0.5}
recording: {enabled: true, directory: artifacts/dcems-smoke/data-generator}
metrics: {enabled: true, sample_seconds: 1.0, window_seconds: 60, retain_seconds: 3600, max_series: 2000}
security:
  callers:
    - {caller_id: cli, token_env: WIND_HUB_DCE_GENERATOR_CLI_TOKEN, permissions: [variables_read, variables_update]}

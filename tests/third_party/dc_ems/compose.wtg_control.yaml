# 单独的 dcems-wtg-control Compose 项目；只绑定本机端口，不复用 dcems-smoke。
# 基础配置仍来自第三方不可变发布包，只有测试 Overlay 覆盖隔离属性。
name: dcems-wtg-control
services:
  dc-ems-db:
    ports: !override
      - "127.0.0.1:15433:5432"
  dc-ems-server:
    network_mode: !reset ""
    ports:
      - "127.0.0.1:18453:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${DCEMS_WTG_SEED:?set absolute path to isolated data.json}
        target: /opt/dc-ems/data.json
        read_only: true
# machine-id 由基础发布 Compose 从 DEPLOY_CONFIG_DIR 挂载，Overlay 不重复声明。
# 发布包只提供 Server 与 TimescaleDB 镜像；Server 镜像内含 html/，
# 并在 HTTPS 443 同端口提供 /dc-ems 静态页与 /api。不得虚构 dc-ems-web 镜像。

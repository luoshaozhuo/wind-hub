# wind-hub 测试专用基础服务：Redis（单节点）。
#
# 只承载测试依赖的外部服务；Collector / CLI 一律由测试以 subprocess 启动，
# 不进入本 Compose。生命周期由 pytest session fixture
# （tests/fixtures/services/compose.py）管理：up -d → 等 health → down -v。
#
# 动态宿主端口由 compose.py 自动分配，支持与既有 Redis 容器并存。
# WIND_HUB_TEST_REDIS 可显式指定外部 Redis，fixture 不会管理该实例。
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${WIND_HUB_TEST_REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

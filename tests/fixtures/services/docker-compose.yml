# wind-hub 测试专用基础服务：Kafka（KRaft 单节点）与 PostgreSQL。
#
# 只承载测试依赖的外部服务；Collector / ctl 一律由测试以 subprocess 启动，
# 不进入本 Compose。生命周期由 pytest session fixture
# （tests/fixtures/services/compose.py）管理：up -d → 等 health → down -v。
#
# 端口映射与 tests/test.env.example 默认值一致；与本机既有服务冲突时，
# 改用 WIND_HUB_TEST_KAFKA / WIND_HUB_TEST_POSTGRES_DSN 指向外部实例，
# fixture 将不再管理 Compose。
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: wind-hub-test-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: windhubtestkafka00
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - 127.0.0.1:9092
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: wind-hub-test-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: windhub
      POSTGRES_PASSWORD: windhub
      POSTGRES_DB: windhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windhub -d windhub"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

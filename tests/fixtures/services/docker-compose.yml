# wind-hub 测试专用基础服务：Redis（单节点）。
#
# 只承载测试依赖的外部服务；Collector / ctl 一律由测试以 subprocess 启动，
# 不进入本 Compose。生命周期由 pytest session fixture
# （tests/fixtures/services/compose.py）管理：up -d → 等 health → down -v。
#
# 端口映射与 tests/test.env.example 默认值一致；与本机既有服务冲突时，
# 改用 WIND_HUB_TEST_REDIS 指向外部实例，fixture 将不再管理 Compose。
services:
  redis:
    image: redis:7-alpine
    container_name: wind-hub-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

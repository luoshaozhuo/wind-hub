sinks:
  file_archive:
    type: file
    enabled: true
    connection:
      path: /var/tmp/wind-hub/example_modbus.csv
      max_size_mb: 100
      max_files: 30
    points:
      - source: {device_id: modbus-001, point_id: active_power}
        ref: modbus_001_active_power
        address: {field: modbus_001_active_power}

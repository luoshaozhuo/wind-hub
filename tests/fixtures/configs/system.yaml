# ---------------------------------------------------------------------------
# 端到端测试用系统配置 —— 短超时 + null sink
# ---------------------------------------------------------------------------

runtime:
  connect_timeout: 2.0
  read_timeout: 2.0
  shutdown_timeout: 5.0
  queue_maxsize: 100
  backpressure_policy: drop_old


interfaces:
  api:
    enabled: true
    host: "127.0.0.1"
    port: 18080
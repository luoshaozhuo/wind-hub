# ---------------------------------------------------------------------------
# 端到端测试用采集任务 —— 每台设备一个 telemetry 组 Task，输出到 null sink
# ---------------------------------------------------------------------------

tasks:

  - task_id: modbus-telemetry
    device: modbus-1
    point_group: telemetry
    interval: 0.2
    targets:
      - sink: null_sink

  - task_id: iec104-telemetry
    device: iec104-1
    point_group: telemetry
    interval: 0.5
    targets:
      - sink: null_sink

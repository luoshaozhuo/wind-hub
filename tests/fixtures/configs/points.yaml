# ---------------------------------------------------------------------------
# 端到端测试用点表 —— 覆盖 Modbus / IEC104，含一个可写点
# ---------------------------------------------------------------------------

points:

  # ---- Modbus（unit 1）：holding 寄存器 ----
  - point_id: rotor.speed
    device_id: modbus-1
    address:
      register_type: holding
      address: 100
    data_type: float32

  - point_id: gen.power
    device_id: modbus-1
    address:
      register_type: holding
      address: 102
    data_type: float32

  - point_id: temp.int
    device_id: modbus-1
    address:
      register_type: holding
      address: 104
    data_type: int16

  - point_id: setpoint.power
    device_id: modbus-1
    address:
      register_type: holding
      address: 200
    data_type: float32

  # ---- IEC104：信息对象地址（IOA）----
  - point_id: rotor.speed
    device_id: iec104-1
    address:
      ioa: 100
    data_type: float32

  - point_id: gen.power
    device_id: iec104-1
    address:
      ioa: 200
    data_type: float32
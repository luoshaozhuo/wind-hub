[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-hub-ads-symbol-export"
version = "0.1.0"
description = "Standalone TwinCAT ADS symbol name exporter"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyads==3.6.0",
]

# ADS OCX 方案（实验性）仅 Windows 需要；平台标记保证 Linux 环境不受影响。
[project.optional-dependencies]
ocx = [
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
ads-symbol-export = "export:main"

[tool.setuptools]
py-modules = ["export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
